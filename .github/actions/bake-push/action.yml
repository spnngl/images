# Merge the platforms bake-build pushed into one manifest list with all the
# target's tags, then sign, check and attest it. The caller's job needs
# `id-token: write` and `attestations: write` (build provenance), and
# `packages: write` (.github/AGENTS.md, "Bake workflows"), and the checkout
# holds `public-key`.
name: bake-push
description: Tag, sign and attest the manifest list of one Bake target.

inputs:
  item:
    description: One target of bake-discover's `targets`, as JSON.
    required: true
  public-key:
    description: The key the signatures are checked with.
    default: bootc/fedora/sysroot/common/usr/share/pki/containers/spnngl-images.pub
  github-token:
    description: Pushes to ghcr.io (packages:write).
    default: ${{ github.token }}
  dockerhub-username:
    description: Docker Hub account.
  dockerhub-token:
    description: Docker Hub access token of dockerhub-username, Read & Write.
  cosign-private-key:
    description: Private key of public-key.
    required: true
  cosign-password:
    description: Password of cosign-private-key, empty for none.
    default: ""

outputs:
  digest:
    description: Digest of the manifest list.
    value: ${{ steps.merge.outputs.digest }}

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        pattern: digest_${{ fromJSON(inputs.item).id }}_*
        path: ${{ runner.temp }}/digests
        merge-multiple: true

    - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    # Docker Hub: a push creates a missing repository, with the account's
    # default visibility.
    - if: inputs.dockerhub-username != ''
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    # Each platform's index (image and attestations) goes into the list: the
    # target's `platforms`. A missing one fails here. imagetools create copies the blobs from
    # the first repository (where bake-build pushed) to each other
    # repository of the tags.
    - id: merge
      shell: bash
      env:
        ITEM: ${{ inputs.item }}
      run: |-
        id="$(jq -r .id <<< "${ITEM}")"
        image="$(jq -r '.repositories[0]' <<< "${ITEM}")"
        mapfile -t tags < <(jq -r '.tags[]' <<< "${ITEM}")
        mapfile -t arches < <(jq -r '.arches[]' <<< "${ITEM}")
        sources=()
        for arch in "${arches[@]}"; do
          sources+=("${image}@$(< "${RUNNER_TEMP}/digests/${id}_${arch}")")
        done
        tag_flags=()
        for tag in "${tags[@]}"; do
          tag_flags+=(--tag "${tag}")
        done
        docker buildx imagetools create "${tag_flags[@]}" "${sources[@]}"
        echo "digest=$(docker buildx imagetools inspect --format '{{ json .Manifest }}' "${tags[0]}" | jq -r .digest)" >> "${GITHUB_OUTPUT}"

    - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

    # The key hosts check (bootc/REFERENCES.md, "Signing"), in the format they
    # read: containers/image (bootc, podman, CRI-O) only reads
    # sha256-<digest>.sig attachments, and can't match a keyless
    # signature's GitHub workflow identity. Hence cosign 3's deprecated
    # legacy flags:
    # - --new-bundle-format=false --use-signing-config=false: the
    #   attachment, not a sigstore bundle behind OCI referrers.
    # - --tlog-upload=false: no Rekor entry; the policy doesn't ask for one.
    # - --sign-container-identity: the tag, as podman writes it. cosign
    #   writes the repository alone otherwise, which the hosts' default
    #   signedIdentity (matchRepoDigestOrExact) rejects for a tag pull.
    #   One signature per tag, in the tag's repository: a host pulling any
    #   of them finds its own.
    # --recursive: the list (what bootc checks) and every manifest in it
    # (what podman and CRI-O check). The key has no passphrase when
    # COSIGN_PASSWORD is empty: without it cosign prompts for one.
    # Not Docker Hub: cosign's manifest reads there hit its pull rate limit
    # (TOOMANYREQUESTS), and hosts and Kubernetes admission trust ghcr.io
    # alone.
    - shell: bash
      env:
        ITEM: ${{ inputs.item }}
        DIGEST: ${{ steps.merge.outputs.digest }}
        COSIGN_PRIVATE_KEY: ${{ inputs.cosign-private-key }}
        COSIGN_PASSWORD: ${{ inputs.cosign-password }}
      run: |-
        mapfile -t tags < <(jq -r '.tags[]' <<< "${ITEM}")
        for tag in "${tags[@]}"; do
          [[ "${tag}" == docker.io/* ]] && continue
          cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false --tlog-upload=false --sign-container-identity "${tag}" "${tag%:*}@${DIGEST}"
        done

    # Every manifest in the list carries, in each repository, a signature
    # from the key hosts trust. --new-bundle-format=false: cosign switches to
    # bundles when the image has one (the provenance below, on a re-run),
    # then ignores the .sig attachment.
    - shell: bash
      env:
        ITEM: ${{ inputs.item }}
        DIGEST: ${{ steps.merge.outputs.digest }}
        PUBLIC_KEY: ${{ inputs.public-key }}
      run: |-
        mapfile -t repositories < <(jq -r '.repositories[]' <<< "${ITEM}")
        first_tag="$(jq -r '.tags[0]' <<< "${ITEM}")"
        mapfile -t digests < <(docker buildx imagetools inspect --raw "${first_tag}" | jq -r '.manifests[].digest')
        for repository in "${repositories[@]}"; do
          [[ "${repository}" == docker.io/* ]] && continue
          for digest in "${DIGEST}" "${digests[@]}"; do
            cosign verify --key "${PUBLIC_KEY}" --new-bundle-format=false --insecure-ignore-tlog=true "${repository}@${digest}" > /dev/null
          done
        done

    # Signed SLSA build provenance (workflow, commit, run) for the manifest
    # list, pushed next to it as an OCI referrer: what Kubernetes admission
    # checks (.github/REFERENCES.md). BuildKit's provenance in the index is
    # unsigned. Check it with gh attestation verify oci://<tag> -R
    # <owner>/<repo>. No storage record: it needs an organization-owned
    # repository. ghcr.io's alone, repositories[0].
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
      with:
        subject-name: ${{ fromJSON(inputs.item).repositories[0] }}
        subject-digest: ${{ steps.merge.outputs.digest }}
        push-to-registry: true
        create-storage-record: false
