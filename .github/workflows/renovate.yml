# Validate renovate.json5 on every change to it: Renovate itself only
# reports an invalid config in an issue, after it was merged. The
# validator and its Renovate image live in spnngl/.github.
name: renovate

on:
  pull_request:
    paths:
      - renovate.json5
      - .github/workflows/renovate.yml
  push:
    branches:
      - main
    paths:
      - renovate.json5
      - .github/workflows/renovate.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate:
    permissions:
      contents: read
    uses: spnngl/.github/.github/workflows/renovate.yml@main
