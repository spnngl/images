# Daily scan of the pushed images: a new vulnerability shows up without
# any change here. Findings go to code scanning; it never fails on one.
# Every tag pushed in the last 8 days, which the weekly rebuilds cover
# (spnngl/.github's image-scan.yml). Pull requests are scanned by the
# build workflows.
name: image-scan

on:
  schedule:
    - cron: "12 8 * * *"
      timezone: Europe/Paris
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # The packages to scan (.github/REFERENCES.md): build-bootc.yml's
  # matrix names, and the folders of the Bake files (build-apps.yml's
  # image name). An input of the shared workflow: GitHub's API refuses to
  # list an owner's packages to GITHUB_TOKEN.
  packages:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: find
        run: |-
          shopt -s nullglob
          # bootc: the repositories of the Bake targets' tags, the GPU
          # image's included.
          bake=(-f docker-bake.hcl -f bootc/docker-bake.hcl)
          for file in bootc/*/docker-bake.hcl; do
            bake+=(-f "${file}")
          done
          packages="$(
            {
              docker buildx bake "${bake[@]}" --print '*' |
                jq -r '.target[].tags[]? | select(startswith("ghcr.io/spnngl/images/")) | sub(":.*"; "") | sub("^ghcr.io/spnngl/images/"; "")'
              for file in containers/*/docker-bake.hcl; do
                basename "$(dirname "${file}")"
              done
            } | sort -u | sed 's|^|images/|' | paste -sd ' ' -
          )"
          echo "packages=${packages}" >> "${GITHUB_OUTPUT}"

  image-scan:
    needs: packages
    permissions:
      contents: read
      packages: read
      security-events: write
    uses: spnngl/.github/.github/workflows/image-scan.yml@main
    with:
      packages: ${{ needs.packages.outputs.packages }}
