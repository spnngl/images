# Build every Dalec image (each images/<name>/spec.yml, see
# ARCHITECTURE.md), then push it to ghcr.io/spnngl/images/<name>:<version>,
# <version> being the upstream release (the spec's args.BASE_VERSION).
# Pull requests only build (which runs the spec's tests), they never push.
#
# Not in build.yml: Dalec is a BuildKit frontend (the spec's # syntax=
# line), which podman/buildah can't run. Docker tooling only: buildx
# builds, pushes and merges, cosign signs.
name: build-dalec

on:
  push:
    branches:
      - main
  pull_request:
  # Weekly rebuild: picks up Debian's security updates.
  schedule:
    - cron: "0 7 * * 0"
      timezone: Europe/Paris
  workflow_dispatch:

# Every run on main pushes the same tags: cancel the older run so it can't
# overwrite the newer one's images.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The images to build: every folder of images/ with a spec.yml, and its
  # args.BASE_VERSION, the spec being the only place it is written.
  discover:
    runs-on: ubuntu-26.04
    outputs:
      images: ${{ steps.find.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      # nullglob: no spec gives [], not the pattern. yq -e fails on a spec
      # without BASE_VERSION.
      - id: find
        run: |-
          shopt -s nullglob
          for spec in images/*/spec.yml; do
            name="$(basename "$(dirname "${spec}")")"
            version="$(yq -e '.args.BASE_VERSION' "${spec}")"
            jq -cn --arg name "${name}" --arg version "${version}" '{name: $name, version: $version}'
          done | jq -cs . > "${RUNNER_TEMP}/images.json"
          echo "images=$(< "${RUNNER_TEMP}/images.json")" >> "${GITHUB_OUTPUT}"

  # One job per image and platform, each on a runner of that platform:
  # native builds and tests, no QEMU. The push job below merges them into
  # one manifest list per image.
  build:
    name: build ${{ matrix.image.name }}:${{ matrix.image.version }} ${{ matrix.platform.arch }}
    needs: discover
    if: needs.discover.outputs.images != '[]'
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
        # Keep the push job's ARCHES in sync.
        platform:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    env:
      IMAGE: ghcr.io/spnngl/images/${{ matrix.image.name }}
      # Same as the push job's: <image>_<arch>.
      ARTIFACT: ${{ matrix.image.name }}_${{ matrix.image.version }}_${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@v7

      # A docker-container builder: the default docker driver can't add
      # provenance and SBOM attestations.
      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The last commit's time, as in build.yml: Dalec exports it to the
      # build (packaging tools clamp the package's file times to it), and
      # BuildKit dates the image with it.
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "${GITHUB_ENV}"

      # trixie/container: the minimal image, from scratch (see the spec).
      # Context is images/, as in build.yml.
      # Attestations, attached to the image in its index
      # (https://docs.docker.com/build/metadata/attestations/):
      # - provenance mode=max: also the build args and each step's
      #   details (the spec has no secrets); version=v1, SLSA 1.x.
      # - sbom: BuildKit scans the final image for any frontend, Dalec
      #   included: the Debian packages (dpkg database) and the Python
      #   ones (dist-info).
      # outputs: pushed by digest, untagged (not on pull requests); the push
      # job tags the manifest list. rewrite-timestamp: BuildKit also clamps
      # the layers' file times to SOURCE_DATE_EPOCH, otherwise they keep the
      # build's time.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: images
          file: images/${{ matrix.image.name }}/spec.yml
          target: trixie/container
          platforms: linux/${{ matrix.platform.arch }}
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          provenance: mode=max,version=v1
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }},rewrite-timestamp=true

      # The digest, for the push job: one file per image and platform.
      - if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |-
          mkdir -p "${RUNNER_TEMP}/digests"
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/digests/${ARTIFACT}"
      # overwrite: "Re-run all jobs" uploads names this run already has.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/digests/${{ env.ARTIFACT }}
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  # Merge each image's platforms into one tagged manifest list, then sign
  # and check it.
  push:
    name: push ${{ matrix.image.name }}:${{ matrix.image.version }}
    needs:
      - discover
      - build
    # needs: build waits for every build job, and fails if any did. Run
    # anyway, unless cancelled: each image pushes on its own, and fails
    # below if one of its platforms is missing.
    if: >-
      !cancelled() && github.event_name != 'pull_request' && needs.build.result != 'skipped'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    env:
      # The build job's platform list.
      ARCHES: amd64 arm64
      IMAGE: ghcr.io/spnngl/images/${{ matrix.image.name }}
      TAG: ghcr.io/spnngl/images/${{ matrix.image.name }}:${{ matrix.image.version }}
      ARTIFACT_PREFIX: ${{ matrix.image.name }}_${{ matrix.image.version }}
    steps:
      # The public key the check below uses.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.ARTIFACT_PREFIX }}_*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each platform's index (image and attestations) goes into the list,
      # attestations included. A missing platform fails here.
      - id: merge
        run: |-
          read -r -a arches <<< "${ARCHES}"
          sources=()
          for arch in "${arches[@]}"; do
            sources+=("${IMAGE}@$(< "${RUNNER_TEMP}/digests/${ARTIFACT_PREFIX}_${arch}")")
          done
          docker buildx imagetools create --tag "${TAG}" "${sources[@]}"
          echo "digest=$(docker buildx imagetools inspect --format '{{ json .Manifest }}' "${TAG}" | jq -r .digest)" >> "${GITHUB_OUTPUT}"

      - uses: sigstore/cosign-installer@v4.1.2

      # The key hosts check (ARCHITECTURE.md, "Signing"), in the format they
      # read: containers/image (bootc, podman, CRI-O) only reads
      # sha256-<digest>.sig attachments, and can't match a keyless
      # signature's GitHub workflow identity. Hence cosign 3's deprecated
      # legacy flags:
      # - --new-bundle-format=false --use-signing-config=false: the
      #   attachment, not a sigstore bundle behind OCI referrers.
      # - --tlog-upload=false: no Rekor entry; the policy doesn't ask for one.
      # - --sign-container-identity: the tag, as podman writes it. cosign
      #   writes the repository alone otherwise, which the hosts' default
      #   signedIdentity (matchRepoDigestOrExact) rejects for a tag pull.
      # --recursive: the list (what bootc checks) and every manifest in it
      # (what podman and CRI-O check). The key has no passphrase:
      # COSIGN_PASSWORD empty, without it cosign prompts for one.
      - env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false --tlog-upload=false --sign-container-identity "${TAG}" "${IMAGE}@${DIGEST}"

      # Every manifest in the list carries a signature from the key hosts
      # trust (the public key in the fedora image).
      - env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |-
          mapfile -t digests < <(docker buildx imagetools inspect --raw "${TAG}" | jq -r '.manifests[].digest')
          for digest in "${DIGEST}" "${digests[@]}"; do
            cosign verify --key images/fedora/sysroot/common/usr/share/pki/containers/spnngl-images.pub --insecure-ignore-tlog=true "${IMAGE}@${digest}" > /dev/null
          done
