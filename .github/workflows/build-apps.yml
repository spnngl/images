# Build the application images (see ARCHITECTURE.md): Dalec images
# (images/<name>/spec.yml) and Containerfile ones (images/<name>/Containerfile,
# not bootc), those that changed since the last build, every one on the
# weekly rebuild and manual runs (see the discover job). Then push them to
# ghcr.io/spnngl/images/<name>:<version>, <version> being the upstream
# release (the spec's args.BASE_VERSION, the Containerfile's ARG
# BASE_VERSION default). Pull requests only lint and build (which runs
# the spec's tests, the Containerfile's smoke test), they never push.
#
# Not in build-bootc.yml: Dalec is a BuildKit frontend (the spec's #
# syntax= line), which podman/buildah can't run. Docker tooling only:
# buildx builds, pushes and merges, cosign signs. Application
# Containerfiles too: one way to build, attest and sign every application
# image.
name: build-apps

on:
  push:
    branches:
      - main
  pull_request:
  # Weekly rebuild: picks up Debian's security updates.
  schedule:
    - cron: "0 7 * * 0"
      timezone: Europe/Paris
  workflow_dispatch:

# Every run on main pushes the same tags: cancel the older run so it can't
# overwrite the newer one's images. The newer one also builds the changes
# of the cancelled one (see the discover job).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The images to build. Found, not listed: every folder of images/ with a
  # spec.yml or a Containerfile, bootc ones excepted, its version being
  # where Renovate updates it, the only place it is written.
  # Only those that changed: a file of the image's folder, or every image
  # for a file at the root of images/ (the shared build context) or this
  # workflow.
  discover:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # gh run list, below.
      actions: read
    outputs:
      images: ${{ steps.find.outputs.images }}
      containerfiles: ${{ steps.find.outputs.containerfiles }}
    steps:
      - uses: actions/checkout@v7

      # The changed files, as a JSON array, or null to build every image:
      # - pull request: its changes, against its base.
      # - push: those since this workflow's last successful run on the
      #   branch, not since the previous push: a cancelled or failed run
      #   never pushed its images, so the next one builds its changes too.
      #   Pull requests' runs are skipped: their commit isn't the
      #   branch's.
      # - schedule, workflow_dispatch, or no base (first run, history
      #   rewritten: fetching it fails): null.
      # checkout fetches one commit: diff compares two trees, it needs no
      # history between them. --no-renames: a renamed file changes the
      # image it left too.
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |-
          base=""
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              base="${PR_BASE}"
              ;;
            push)
              base="$(gh run list --workflow build-apps.yml --branch "${GITHUB_REF_NAME}" --status success --limit 20 --json headSha,event --jq 'map(select(.event != "pull_request"))[0].headSha // empty')"
              ;;
            *) ;;
          esac
          if [[ -n "${base}" ]] && git fetch --quiet --depth=1 origin "${base}"; then
            echo "files=$(git diff --name-only --no-renames "${base}" HEAD | jq -Rcn '[inputs]')" >> "${GITHUB_OUTPUT}"
          else
            echo "files=null" >> "${GITHUB_OUTPUT}"
          fi

      # nullglob: no image gives [], not the pattern. yq -e fails on a spec
      # without BASE_VERSION, the version check on a Containerfile without
      # an ARG BASE_VERSION default. A Containerfile running bootc container
      # lint is a bootc image's (AGENTS.md): build-bootc.yml builds it.
      # Dalec images: their target is the minimal image, from scratch (see
      # the specs). Containerfiles: the last stage.
      - id: find
        env:
          FILES: ${{ steps.changes.outputs.files }}
        run: |-
          shopt -s nullglob
          {
            for file in images/*/spec.yml; do
              version="$(yq -e '.args.BASE_VERSION' "${file}")"
              jq -cn --arg file "${file}" --arg version "${version}" '{file: $file, version: $version, target: "trixie/container"}'
            done
            for file in images/*/Containerfile; do
              grep -q '^RUN bootc container lint' "${file}" && continue
              version="$(sed -n 's/^ARG BASE_VERSION=//p' "${file}")"
              [[ -n "${version}" ]] || { echo "::error file=${file}::no ARG BASE_VERSION=<version>"; exit 1; }
              jq -cn --arg file "${file}" --arg version "${version}" '{file: $file, version: $version, target: ""}'
            done
          } | jq -cs --argjson files "${FILES}" '
            map(.name = (.file | split("/")[1]))
            | if $files == null or any($files[]; . == ".github/workflows/build-apps.yml" or test("^images/[^/]+$")) then .
              else map(select(.name as $name | any($files[]; startswith("images/\($name)/"))))
              end' > "${RUNNER_TEMP}/images.json"
          echo "images=$(< "${RUNNER_TEMP}/images.json")" >> "${GITHUB_OUTPUT}"
          echo "containerfiles=$(jq -c 'map(.file | select(endswith("/Containerfile")))' "${RUNNER_TEMP}/images.json")" >> "${GITHUB_OUTPUT}"

  # Same as build-bootc.yml's, for the Containerfiles to build only: code
  # scanning keeps the others' alerts, from their last analysis.
  hadolint:
    needs: discover
    if: needs.discover.outputs.containerfiles != '[]'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        containerfile: ${{ fromJSON(needs.discover.outputs.containerfiles) }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.containerfile }}
          format: sarif
          output-file: hadolint-results.sarif
          failure-threshold: warning

      - name: Upload Hadolint results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: hadolint-results.sarif
          # Code scanning tracks alerts per category: keep it stable per
          # file so fixed findings close.
          category: hadolint-${{ matrix.containerfile }}
        if: always()

  # One job per image and platform, each on a runner of that platform:
  # native builds and tests, no QEMU. The push job below merges them into
  # one manifest list per image.
  build:
    name: build ${{ matrix.image.name }}:${{ matrix.image.version }} ${{ matrix.platform.arch }}
    needs:
      - discover
      - hadolint
    # Also when hadolint is skipped (no Containerfile to build), not when
    # it failed.
    if: >-
      !cancelled() && !failure() && needs.discover.outputs.images != '[]'
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
        # Keep the push job's ARCHES in sync.
        platform:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    env:
      IMAGE: ghcr.io/spnngl/images/${{ matrix.image.name }}
      # Same as the push job's: <image>_<arch>.
      ARTIFACT: ${{ matrix.image.name }}_${{ matrix.image.version }}_${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@v7

      # A docker-container builder: the default docker driver can't add
      # provenance and SBOM attestations.
      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The last commit's time, as in build-bootc.yml: Dalec exports it to
      # the build (packaging tools clamp the package's file times to it),
      # the Containerfiles read it (ARG SOURCE_DATE_EPOCH), and BuildKit
      # dates the image with it.
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "${GITHUB_ENV}"

      # Context is images/, as in build-bootc.yml. target: none ("") for a
      # Containerfile, its last stage.
      # Attestations, attached to the image in its index
      # (https://docs.docker.com/build/metadata/attestations/):
      # - provenance mode=max: also the build args and each step's
      #   details (no secrets); version=v1, SLSA 1.x.
      # - sbom: BuildKit scans the final image for any frontend, Dalec
      #   included: the Debian packages (dpkg database), the Python ones
      #   (dist-info), a Go binary's modules.
      # outputs: pushed by digest, untagged (not on pull requests); the push
      # job tags the manifest list. rewrite-timestamp: BuildKit also clamps
      # the layers' file times to SOURCE_DATE_EPOCH, otherwise they keep the
      # build's time. Pull requests: also an OCI layout, for the scan below
      # (nothing else keeps the image on the runner).
      # An empty line is no output.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: images
          file: ${{ matrix.image.file }}
          target: ${{ matrix.image.target }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          provenance: mode=max,version=v1
          sbom: true
          outputs: |
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }},rewrite-timestamp=true
            ${{ github.event_name == 'pull_request' && format('type=oci,dest={0}/oci,tar=false', runner.temp) || '' }}

      # Same as build-bootc.yml's: pull requests fail on a Critical
      # vulnerability with a fix that the pushed image doesn't have; pushed
      # images, image-scan.yml.
      - if: github.event_name == 'pull_request'
        uses: spnngl/.github/.github/actions/scan-image@main
        with:
          oci-layout: ${{ runner.temp }}/oci
          baseline: ${{ env.IMAGE }}:${{ matrix.image.version }}
          platform: linux/${{ matrix.platform.arch }}
          fail: true

      # The digest, for the push job: one file per image and platform.
      - if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |-
          mkdir -p "${RUNNER_TEMP}/digests"
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/digests/${ARTIFACT}"
      # overwrite: "Re-run all jobs" uploads names this run already has.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/digests/${{ env.ARTIFACT }}
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  # Merge each image's platforms into one tagged manifest list, then sign
  # and check it.
  push:
    name: push ${{ matrix.image.name }}:${{ matrix.image.version }}
    needs:
      - discover
      - build
    # needs: build waits for every build job, and fails if any did. Run
    # anyway, unless cancelled: each image pushes on its own, and fails
    # below if one of its platforms is missing.
    if: >-
      !cancelled() && github.event_name != 'pull_request' && needs.build.result != 'skipped'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    env:
      # The build job's platform list.
      ARCHES: amd64 arm64
      IMAGE: ghcr.io/spnngl/images/${{ matrix.image.name }}
      TAG: ghcr.io/spnngl/images/${{ matrix.image.name }}:${{ matrix.image.version }}
      ARTIFACT_PREFIX: ${{ matrix.image.name }}_${{ matrix.image.version }}
    steps:
      # The public key the check below uses.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.ARTIFACT_PREFIX }}_*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each platform's index (image and attestations) goes into the list,
      # attestations included. A missing platform fails here.
      - id: merge
        run: |-
          read -r -a arches <<< "${ARCHES}"
          sources=()
          for arch in "${arches[@]}"; do
            sources+=("${IMAGE}@$(< "${RUNNER_TEMP}/digests/${ARTIFACT_PREFIX}_${arch}")")
          done
          docker buildx imagetools create --tag "${TAG}" "${sources[@]}"
          echo "digest=$(docker buildx imagetools inspect --format '{{ json .Manifest }}' "${TAG}" | jq -r .digest)" >> "${GITHUB_OUTPUT}"

      - uses: sigstore/cosign-installer@v4.1.2

      # The key hosts check (ARCHITECTURE.md, "Signing"), in the format they
      # read: containers/image (bootc, podman, CRI-O) only reads
      # sha256-<digest>.sig attachments, and can't match a keyless
      # signature's GitHub workflow identity. Hence cosign 3's deprecated
      # legacy flags:
      # - --new-bundle-format=false --use-signing-config=false: the
      #   attachment, not a sigstore bundle behind OCI referrers.
      # - --tlog-upload=false: no Rekor entry; the policy doesn't ask for one.
      # - --sign-container-identity: the tag, as podman writes it. cosign
      #   writes the repository alone otherwise, which the hosts' default
      #   signedIdentity (matchRepoDigestOrExact) rejects for a tag pull.
      # --recursive: the list (what bootc checks) and every manifest in it
      # (what podman and CRI-O check). The key has no passphrase:
      # COSIGN_PASSWORD empty, without it cosign prompts for one.
      - env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY --new-bundle-format=false --use-signing-config=false --tlog-upload=false --sign-container-identity "${TAG}" "${IMAGE}@${DIGEST}"

      # Every manifest in the list carries a signature from the key hosts
      # trust (the public key in the fedora image).
      - env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: |-
          mapfile -t digests < <(docker buildx imagetools inspect --raw "${TAG}" | jq -r '.manifests[].digest')
          for digest in "${DIGEST}" "${digests[@]}"; do
            cosign verify --key images/fedora/sysroot/common/usr/share/pki/containers/spnngl-images.pub --insecure-ignore-tlog=true "${IMAGE}@${digest}" > /dev/null
          done
