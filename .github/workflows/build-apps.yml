# Build the application images (.github/REFERENCES.md): Dalec ones
# (containers/<name>/spec.yml) and Containerfile ones
# (containers/<name>/Containerfile), those that changed since the last
# build (every one on the weekly rebuild and manual runs: see
# .github/actions/bake-discover), and push them to the tags of their Bake
# target (containers/AGENTS.md): ghcr.io/spnngl/images/<name>:<version> and
# docker.io/loladelannoy/<name>:<version>, <version> being the upstream
# release, Docker Hub's unsigned (see bake-push). Pull requests lint and
# build (running the spec's tests, the Containerfile's smoke test), never
# push.
# bootc images: build-bootc.yml.
#
# Bake describes what to build; the .github/actions/bake-* actions run it:
# one job per target and platform, scanned before anything is pushed
# (docker/github-builder pushes first).
name: build-apps

on:
  push:
    branches:
      - main
  pull_request:
  # Weekly rebuild: picks up Debian's security updates.
  schedule:
    - cron: "0 7 * * 0"
      timezone: Europe/Paris
  workflow_dispatch:

# One run per branch at a time. Every run on main pushes the same tags, so
# they queue: a run cancelled between its push and its signature would
# leave a tag that hosts checking signatures refuse. A newer queued run
# replaces an older queued one, and builds its changes too (bake-discover
# compares with the last successful run). A pull request's older run is
# cancelled: it pushes nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The images to build, found not listed: the targets of the Bake files
  # (containers/docker-bake.hcl, containers/*/docker-bake.hcl), where
  # versions are written once and Renovate updates them.
  discover:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # gh run list, in bake-discover.
      actions: read
    outputs:
      targets: ${{ steps.discover.outputs.targets }}
      builds: ${{ steps.discover.outputs.builds }}
      files: ${{ steps.discover.outputs.files }}
      containerfiles: ${{ steps.discover.outputs.containerfiles }}
      kindtest: ${{ steps.discover.outputs.kindtest }}
    steps:
      # The action's own files: a local action needs the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: discover
        uses: ./.github/actions/bake-discover
        with:
          # The root file holds line(); the others, the targets.
          files: |-
            docker-bake.hcl
            containers/docker-bake.hcl
            containers/*/docker-bake.hcl
          workflow: build-apps.yml
          # A pull request changing this workflow or a bake-* action builds
          # one image of each kind, not all of them (hours on the runners):
          # a Containerfile, a Dalec spec, and an entitlement with a smoke
          # test (buildkit). The push that merges it builds every image.
          sample: |-
            busybox
            nftables-exporter-debian13
            buildkit

  # Same as build-bootc.yml's, for the Containerfiles to build only: code
  # scanning keeps the others' alerts, from their last analysis.
  hadolint:
    needs: discover
    if: needs.discover.outputs.containerfiles != '[]'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        containerfile: ${{ fromJSON(needs.discover.outputs.containerfiles) }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.containerfile }}
          format: sarif
          output-file: hadolint-results.sarif
          failure-threshold: warning

      - name: Upload Hadolint results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: hadolint-results.sarif
          # Code scanning tracks alerts per category: keep it stable per
          # file so fixed findings close.
          category: hadolint-${{ matrix.containerfile }}
        if: always()

  # The policies of policy/ on every application image's sources
  # (policy/AGENTS.md): seconds, so on every event and every file, a
  # policy change reaching them all. Before build, as hadolint: a broken
  # rule builds nothing.
  conftest:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: policy/conftest.sh --sarif conftest-results containers

      - name: Upload conftest results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          # One file per namespace, each with its category
          # (runs[].automationDetails.id): conftest-<namespace>.
          sarif_file: conftest-results
        if: always()

  # One job per target and platform, each on a runner of that platform:
  # native builds and tests, no QEMU. The push job below merges them into
  # one manifest list per target.
  build:
    name: build ${{ matrix.target.id }} ${{ matrix.platform.arch }}
    needs:
      - discover
      - hadolint
      - conftest
    # Also when hadolint is skipped (no Containerfile to build), not when
    # it or conftest failed.
    if: >-
      !cancelled() && !failure() && needs.discover.outputs.targets != '[]'
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pull requests: an OCI layout, scanned below; others: pushed by
      # digest. Weekly and manual rebuilds skip the build cache, to fetch
      # the packages that follow their archive, and refresh it
      # (.github/REFERENCES.md).
      - uses: ./.github/actions/bake-build
        with:
          item: ${{ toJSON(matrix.target) }}
          arch: ${{ matrix.platform.arch }}
          files: ${{ needs.discover.outputs.files }}
          push: ${{ github.event_name != 'pull_request' }}
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pull requests fail on a Critical vulnerability with a fix that the
      # pushed image doesn't have (.github/REFERENCES.md, "Vulnerability
      # scanning"); pushed images, image-scan.yml. The baseline: the
      # target's first tag.
      - if: github.event_name == 'pull_request'
        uses: spnngl/.github/.github/actions/scan-image@main
        with:
          oci-layout: ${{ runner.temp }}/oci
          baseline: ${{ matrix.target.tags[0] }}
          platform: linux/${{ matrix.platform.arch }}
          fail: true

  # containers/structure-test.yaml, or bake-test, changed: the images not
  # built above are tested as pushed (their config alone), every
  # platform, so that a rule none of them meets fails here, not at their
  # next push.
  kind-test:
    needs: discover
    if: needs.discover.outputs.kindtest != '[]'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      # The action's own files: a local action needs the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/bake-test
        with:
          targets: ${{ needs.discover.outputs.kindtest }}

  # The pull request gate: the one check of this workflow the main
  # ruleset requires, the others being named after the images that
  # changed (.github/REFERENCES.md). Passes when every job above passed
  # or was skipped (nothing to lint or build). always(): GitHub counts a
  # skipped required check as passed, so this one must run when a job
  # above fails.
  gate:
    needs:
      - discover
      - hadolint
      - conftest
      - build
      - kind-test
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - env:
          # The results alone: needs also holds discover's outputs, every
          # target, past what one environment variable may hold.
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |-
          jq -e 'all(.[]; . == "success" or . == "skipped")' <<< "${RESULTS}"

  # Merge each target's platforms into one manifest list with all its
  # tags, on ghcr.io and Docker Hub, then sign, check and attest it.
  push:
    name: push ${{ matrix.target.id }}
    needs:
      - discover
      - build
    # needs: build waits for every build job, and fails if any did. Run
    # anyway, unless cancelled: each target pushes on its own, and fails
    # if one of its platforms is missing.
    if: >-
      !cancelled() && github.event_name != 'pull_request' && needs.build.result != 'skipped'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      # Build provenance attestation: OIDC token for its Sigstore
      # certificate, and storing it on GitHub.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      # The action's own files: a local action needs the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # DOCKERHUB_TOKEN is a personal access token of DOCKERHUB_USERNAME,
      # Read & Write.
      - uses: ./.github/actions/bake-push
        with:
          item: ${{ toJSON(matrix.target) }}
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          cosign-private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}
