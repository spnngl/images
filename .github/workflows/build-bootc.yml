# Build the bootc images (bootc/AGENTS.md): fedora, almalinux and
# fedora-coreos, those that changed since the last build (every one on the
# weekly rebuild and manual runs: see .github/actions/bake-discover), and
# push them to the tags of their Bake target (bootc/*/docker-bake.hcl):
# ghcr.io/spnngl/images/<name>:<tag>, signed with our key, which hosts check
# (bootc/REFERENCES.md, "Signing"). Pull requests build, scan and test,
# never push.
# Application images: build-apps.yml.
#
# Bake describes what to build; the .github/actions/bake-* actions run it:
# one job per target and platform; the VM tests of fedora-coreos pass before
# any of its tags is pushed.
#
# Disk images (bootc/build.sh) carry no user: fedora-coreos's OpenStack qcow2
# and fedora's and almalinux's are releases (release jobs), the latter after
# a boot test.
name: build-bootc

on:
  push:
    branches:
      - main
  pull_request:
  # Weekly rebuild: picks up the base images' updates.
  schedule:
    - cron: "0 7 * * 0"
      timezone: Europe/Paris
  workflow_dispatch:

# Every run on main pushes the same tags: cancel the older run so it can't
# overwrite the newer one's images. The newer one also builds the changes
# of the cancelled one (see bake-discover).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The images to build, found not listed: the targets of the Bake files,
  # where versions are written once and Renovate updates them.
  discover:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # gh run list, in bake-discover.
      actions: read
    outputs:
      targets: ${{ steps.discover.outputs.targets }}
      builds: ${{ steps.discover.outputs.builds }}
      files: ${{ steps.discover.outputs.files }}
      containerfiles: ${{ steps.discover.outputs.containerfiles }}
      groups: ${{ steps.discover.outputs.groups }}
      releases: ${{ steps.releases.outputs.releases }}
      disks: ${{ steps.releases.outputs.disks }}
    steps:
      # The action's own files: a local action needs the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - id: discover
        uses: ./.github/actions/bake-discover
        with:
          # The root file holds line(); the others, the targets.
          files: |-
            docker-bake.hcl
            bootc/docker-bake.hcl
            bootc/*/docker-bake.hcl
          workflow: build-bootc.yml

      # One release per fedora-coreos line, when it or its GPU image
      # changed: the ids of the images that are not the GPU's; and one per
      # changed fedora or almalinux image: their targets.
      - id: releases
        env:
          GROUPS_JSON: ${{ steps.discover.outputs.groups }}
          TARGETS: ${{ steps.discover.outputs.targets }}
        run: |-
          echo "releases=$(jq -c '.["disk-image"] | map(sub("^fedora-coreos-nvidia-"; "fedora-coreos-")) | unique' <<< "${GROUPS_JSON}")" >> "${GITHUB_OUTPUT}"
          echo "disks=$(jq -c '[.[] | select(.file | test("^bootc/(fedora|almalinux)/"))]' <<< "${TARGETS}")" >> "${GITHUB_OUTPUT}"

  # Same as build-apps.yml's, for the Containerfiles to build only: code
  # scanning keeps the others' alerts, from their last analysis.
  hadolint:
    needs: discover
    if: needs.discover.outputs.containerfiles != '[]'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        containerfile: ${{ fromJSON(needs.discover.outputs.containerfiles) }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.containerfile }}
          format: sarif
          output-file: hadolint-results.sarif
          failure-threshold: warning

      - name: Upload Hadolint results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: hadolint-results.sarif
          # Code scanning tracks alerts per category: keep it stable per
          # file so fixed findings close.
          category: hadolint-${{ matrix.containerfile }}
        if: always()

  # One job per target and platform, each on a runner of that platform:
  # native builds and tests, no QEMU. The push job below merges them into
  # one manifest list per target.
  build:
    name: build ${{ matrix.target.id }} ${{ matrix.platform.arch }}
    needs:
      - discover
      - hadolint
    # Also when hadolint is skipped (no Containerfile to build), not when
    # it failed.
    if: >-
      !cancelled() && !failure() && needs.discover.outputs.targets != '[]'
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pull requests: an OCI layout, scanned and tested below; others:
      # pushed by digest. fedora-coreos's amd64 build also exports the scan
      # and goss reports (its `-reports` target, sharing the image's stages):
      # the nodes are x86_64. Weekly and manual rebuilds skip the build
      # cache, to fetch the packages that follow their archive, and
      # refresh it (.github/REFERENCES.md).
      - uses: ./.github/actions/bake-build
        with:
          item: ${{ toJSON(matrix.target) }}
          arch: ${{ matrix.platform.arch }}
          files: ${{ needs.discover.outputs.files }}
          also: ${{ startsWith(matrix.target.id, 'fedora-coreos') && matrix.platform.arch == 'amd64' && format('{0}-reports', matrix.target.id) || '' }}
          push: ${{ github.event_name != 'pull_request' }}
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      # The reports of the build (OpenSCAP, grype, goss): kept, and the job
      # fails on a failed rule, a fixable Critical or a failed check
      # (bootc/fedora-coreos/REFERENCES.md): the `check` stage wrote
      # reports/failed then.
      - if: always() && hashFiles('reports/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports_${{ matrix.target.id }}
          path: reports
          overwrite: true
          retention-days: 14
      - if: startsWith(matrix.target.id, 'fedora-coreos') && matrix.platform.arch == 'amd64'
        run: |-
          cat reports/summary.txt
          [[ ! -e reports/failed ]]

      # Pull requests: findings are reported, against the target's first tag
      # as baseline (.github/REFERENCES.md, "Vulnerability scanning");
      # pushed images, image-scan.yml.
      - if: github.event_name == 'pull_request'
        uses: spnngl/.github/.github/actions/scan-image@main
        with:
          oci-layout: ${{ runner.temp }}/oci
          baseline: ${{ matrix.target.tags[0] }}
          platform: linux/${{ matrix.platform.arch }}
          fail: false

      # The VM tests below run on the amd64 image of the targets of the
      # `vm-test` group: on pushes they pull it from the registry, here it
      # only exists as this layout.
      - if: >-
          github.event_name == 'pull_request' && matrix.platform.arch == 'amd64'
          && contains(fromJSON(needs.discover.outputs.groups)['vm-test'], matrix.target.id)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oci_${{ matrix.target.id }}
          path: ${{ runner.temp }}/oci
          overwrite: true
          retention-days: 1
          compression-level: 0

  # The VM tests of fedora-coreos (bootc/fedora-coreos/AGENTS.md, "Build
  # check"): the amd64 image of each target of the `vm-test` group, a node
  # booted from a disk made from it. They pass before the image's tags are
  # pushed.
  vm-test:
    name: vm-test ${{ matrix.id }}
    needs:
      - discover
      - hadolint
      - build
    # As the push job: another image's failed build doesn't stop it. A
    # failed amd64 build leaves no image, and fails here.
    if: >-
      !cancelled() && needs.hadolint.result != 'failure'
      && needs.build.result != 'skipped'
      && toJSON(fromJSON(needs.discover.outputs.groups)['vm-test']) != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.discover.outputs.groups)['vm-test'] }}
    env:
      WORKBENCH: podman
      ID: ${{ matrix.id }}
      TARGETS: ${{ needs.discover.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The image's first tag: the disk follows it (`bootc upgrade`).
      - run: |-
          echo "TAG=$(jq -r --arg id "${ID}" '.[] | select(.id == $id) | .tags[0]' <<< "${TARGETS}")" >> "${GITHUB_ENV}"

      # Pushes: the digest the build job pushed, untagged. Pull requests:
      # the layout it kept.
      - id: artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ github.event_name == 'pull_request' && format('oci_{0}', matrix.id) || format('digest_{0}_amd64', matrix.id) }}
          path: ${{ runner.temp }}/image
      - if: steps.artifact.outcome == 'failure'
        run: |-
          echo "::error::No image to test: the job build ${ID} amd64 failed"
          exit 1
      # bwrap-userns-restrict: as the release job. No disk clean-up, as
      # the release job's: the runner's 145 GB disk is enough (df at the
      # end of the job).
      - run: sudo apparmor_parser --remove /etc/apparmor.d/bwrap-userns-restrict
      # The qemu disk image: in the workbench, from the OCI archive, which
      # test-greenboot.sh also reads there.
      - env:
          EVENT: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |-
          archive="oci-archive:${RUNNER_TEMP}/fedora-coreos.ociarchive"
          if [[ ${EVENT} == pull_request ]]; then
            skopeo copy --quiet --override-arch amd64 "oci:${RUNNER_TEMP}/image" "${archive}"
          else
            skopeo copy --quiet --override-arch amd64 --src-creds "${GITHUB_ACTOR}:${GITHUB_TOKEN}" "docker://${TAG%:*}@$(< "${RUNNER_TEMP}/image/digest_${ID}_amd64")" "${archive}"
          fi
          rm -rf "${RUNNER_TEMP}/image"
          bootc/fedora-coreos/workbench.sh up
          bootc/fedora-coreos/workbench.sh exec bash -c 'cat > /work/fedora-coreos.ociarchive' < "${RUNNER_TEMP}/fedora-coreos.ociarchive"
          rm "${RUNNER_TEMP}/fedora-coreos.ociarchive"
          bootc/fedora-coreos/workbench.sh exec bash -s -- /work qemu "ostree-image-signed:docker://${TAG}" \
            < bootc/fedora-coreos/disk-images.sh
      - id: vm
        run: bootc/fedora-coreos/vm.sh up
      - run: bootc/fedora-coreos/test.sh node
      - run: bootc/fedora-coreos/test.sh wx
      - run: bootc/fedora-coreos/vm.sh cluster
      - run: bootc/fedora-coreos/test.sh cluster
      # W^X's remounts again, after a boot of a node with a cluster, and
      # the cluster back.
      - run: |-
          bootc/fedora-coreos/vm.sh reboot
          bootc/fedora-coreos/test.sh wx
          bootc/fedora-coreos/test.sh cluster
      - run: bootc/fedora-coreos/test-greenboot.sh
      - if: always()
        run: df -h /
      # The serial console: boot and Ignition errors, the reboots. Only once
      # the VM was started: before, there is no workbench to read it from.
      - if: failure() && steps.vm.outcome != 'skipped'
        run: bootc/fedora-coreos/vm.sh log | tail -n 300

      # What the push job of this image, and of its GPU image, waits for: a
      # failed line leaves the others' pushes alone.
      - run: touch "${RUNNER_TEMP}/vm-passed_${ID}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vm-passed_${{ matrix.id }}
          path: ${{ runner.temp }}/vm-passed_${{ matrix.id }}
          overwrite: true
          retention-days: 1

  # The pull request gate: the one check of this workflow the main
  # ruleset requires, the others being named after the images that
  # changed (.github/REFERENCES.md). Passes when every job above passed
  # or was skipped (nothing to lint or build). always(): GitHub counts a
  # skipped required check as passed, so this one must run when a job
  # above fails.
  gate-bootc:
    needs:
      - discover
      - hadolint
      - build
      - vm-test
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |-
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "${NEEDS}"

  # Merge each target's platforms into one manifest list, then sign, check
  # and attest it; fedora-coreos's only when its VM tests passed.
  push:
    name: push ${{ matrix.target.id }}
    needs:
      - discover
      - build
      - vm-test
    # needs: build waits for every build job, and fails if any did. Run
    # anyway, unless cancelled or hadolint failed: each target pushes on its
    # own, and fails if one of its platforms is missing, or, for
    # fedora-coreos, if its VM tests didn't pass.
    if: >-
      !cancelled() && github.event_name != 'pull_request' && needs.build.result != 'skipped'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      # Build provenance attestation: OIDC token for its Sigstore
      # certificate, and storing it on GitHub.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    env:
      ITEM: ${{ toJSON(matrix.target) }}
      TESTED: ${{ needs.discover.outputs.groups }}
    steps:
      # The action's own files: a local action needs the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The VM tests are fedora-coreos's: the GPU image's are its line's
      # (same Containerfile and files, up to the nvidia stage), and need
      # to have passed only if they ran in this run.
      - id: tested
        run: |-
          id="$(jq -r .id <<< "${ITEM}")"
          if [[ ${id} == fedora-coreos* ]] && jq -e --arg id "${id/fedora-coreos-nvidia-/fedora-coreos-}" '.["vm-test"] | index($id)' <<< "${TESTED}" > /dev/null; then
            echo "id=${id/fedora-coreos-nvidia-/fedora-coreos-}" >> "${GITHUB_OUTPUT}"
          fi
      - if: steps.tested.outputs.id != ''
        id: vm
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vm-passed_${{ steps.tested.outputs.id }}
          path: ${{ runner.temp }}/vm
      - if: steps.tested.outputs.id != '' && steps.vm.outcome != 'success'
        env:
          ID: ${{ fromJSON(env.ITEM).id }}
        run: |-
          echo "::error::the VM tests of ${{ steps.tested.outputs.id }} didn't pass: ${ID} is not pushed"
          exit 1

      - id: push
        uses: ./.github/actions/bake-push
        with:
          item: ${{ env.ITEM }}
          cosign-private-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign-password: ${{ secrets.COSIGN_PASSWORD }}

      # Pull every platform back with the policy.json this image ships, and
      # the files hosts get from the image, at the same paths: fails if the
      # signing key doesn't match the committed public key, which would make
      # hosts refuse every upgrade.
      - run: |-
          dir="$(jq -r '.file | sub("/[^/]*$"; "")' <<< "${ITEM}")"
          tag="$(jq -r '.tags[0]' <<< "${ITEM}")"
          if [[ ${dir} == bootc/fedora-coreos ]]; then
            signing="${dir}/sysroot/system"
            policy="${signing}/etc/containers/policy.json"
          else
            signing=bootc/fedora/sysroot/common
            policy="${dir}/sysroot/$(jq -r .args.BASE_VERSION <<< "${ITEM}")/etc/containers/policy.json"
          fi
          sudo install -D -m 0644 -t /etc/containers/registries.d/ "${signing}/etc/containers/registries.d/spnngl-images.yaml"
          sudo install -D -m 0644 -t /usr/share/pki/containers/ "${signing}/usr/share/pki/containers/spnngl-images.pub"
          while read -r arch; do
            podman pull --platform "linux/${arch}" --signature-policy "${policy}" "${tag}"
          done < <(jq -r '.arches[]' <<< "${ITEM}")

      # What the release job waits for: this image is pushed.
      - run: |-
          mkdir "${RUNNER_TEMP}/pushed"
          touch "${RUNNER_TEMP}/pushed/pushed_$(jq -r .id <<< "${ITEM}")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pushed_${{ matrix.target.id }}
          path: ${{ runner.temp }}/pushed
          overwrite: true
          retention-days: 1

  # fedora-coreos's OpenStack disk image, and the GPU image's, from the
  # images just pushed, as assets of one release per line: a release per
  # change of the line's targets, the newest 3 of a line kept. Nodes made
  # from them follow the image's tag with `bootc upgrade`. amd64 only: the
  # nodes are x86_64. Not on the weekly rebuild: it changes no file.
  release:
    name: release ${{ matrix.id }}
    needs:
      - discover
      - push
    if: >-
      !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.push.result != 'skipped' && needs.discover.outputs.releases != '[]'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # The qcow2's build provenance attestation, as the push job's.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.discover.outputs.releases) }}
    env:
      ID: ${{ matrix.id }}
      FILES: ${{ needs.discover.outputs.files }}
      CHANGED: ${{ needs.discover.outputs.groups }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # BASE_VERSION, KUBERNETES_VERSION, IMAGE_TAG, GPU_ID: from the line's
      # Bake target, which an unchanged one still has.
      - run: |-
          args=()
          while read -r file; do
            args+=(-f "${file}")
          done <<< "${FILES}"
          target="$(docker buildx bake "${args[@]}" --print "${ID}" | jq -c --arg id "${ID}" '.target[$id]')"
          {
            echo "BASE_VERSION=$(jq -r .args.BASE_VERSION <<< "${target}")"
            echo "KUBERNETES_VERSION=$(jq -r .args.KUBERNETES_VERSION <<< "${target}")"
            echo "IMAGE_TAG=$(jq -r '.tags[0] | sub("^.*:"; "")' <<< "${target}")"
            echo "GPU_ID=${ID/fedora-coreos-/fedora-coreos-nvidia-}"
          } >> "${GITHUB_ENV}"

      # Which of the line's images this run pushed: a changed one that isn't
      # failed to push. The GPU image's failure leaves the release without
      # its disk, and says so; fedora-coreos's fails the job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: pushed_*
          path: ${{ runner.temp }}/pushed
          merge-multiple: true
      - run: |-
          for id in "${ID}" "${GPU_ID}"; do
            if jq -e --arg id "${id}" '.["disk-image"] | index($id)' <<< "${CHANGED}" > /dev/null && [[ ! -e "${RUNNER_TEMP}/pushed/pushed_${id}" ]]; then
              if [[ ${id} == "${ID}" ]]; then
                echo "::error::${id} was not pushed: no release"
                exit 1
              fi
              echo "::warning::${id} was not pushed: this release has no GPU disk image"
              echo GPU_DISK=failed >> "${GITHUB_ENV}"
            fi
          done

      # osbuild keeps a raw disk and two trees of the image: room from the
      # runner's preinstalled SDKs, unused here.
      - run: |-
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /
      # The signed images, checked with the policy.json they ship, as the push
      # job checks them; registries.d and the key at the paths it names. By
      # digest: the tag may have moved since. The disk's origin stays the tag
      # (disk-images.sh below), which nodes follow. --remove-signatures: an
      # oci-archive can't hold them; the policy check still runs on the
      # source (containers/image copy/single.go).
      - run: |-
          sudo install -D -m 0644 -t /etc/containers/registries.d/ bootc/fedora-coreos/sysroot/system/etc/containers/registries.d/spnngl-images.yaml
          sudo install -D -m 0644 -t /usr/share/pki/containers/ bootc/fedora-coreos/sysroot/system/usr/share/pki/containers/spnngl-images.pub
          mkdir "${RUNNER_TEMP}/disk"
      # osbuild needs root and loop devices: a privileged container of the
      # image's Fedora release (bootc/fedora-coreos/REFERENCES.md).
      # Ubuntu's AppArmor profile bwrap-userns-restrict attaches to every
      # /usr/bin/bwrap, the container's too, and denies capabilities to what
      # it runs: osbuild's stages. Unloaded on this throwaway runner.
      # One image after the other, each in a folder of its own that goes once
      # its qcow2 is out: osbuild's trees and raw disk take the room the next
      # needs. disk-images.sh names the file after --osname, fedora-coreos for
      # both: renamed on the way out. fedora-coreos's disk first, and its
      # failure fails the job; the GPU image's runs in a shell of its own, so
      # that the release goes without its disk, and the job fails at its end
      # (GPU_DISK): a re-run of the failed job adds it to the release.
      - run: |-
          sudo apparmor_parser --remove /etc/apparmor.d/bwrap-userns-restrict
          disk() {
            local image="$1" work="${RUNNER_TEMP}/work-$1"
            # The image's repository: its id without the line.
            local repository="ghcr.io/spnngl/images/${image%-*-*}"
            mkdir "${work}"
            skopeo copy --override-arch amd64 --remove-signatures --policy bootc/fedora-coreos/sysroot/system/etc/containers/policy.json \
              "docker://${repository}@$(docker buildx imagetools inspect --format '{{ json .Manifest }}' "${repository}:${IMAGE_TAG}" | jq -r .digest)" "oci-archive:${work}/fedora-coreos.ociarchive"
            sudo podman run --rm --privileged -v /dev:/dev -v "${work}:/work" \
              -v "${PWD}/bootc/fedora-coreos/disk-images.sh:/disk-images.sh:ro" \
              "registry.fedoraproject.org/fedora:${BASE_VERSION%%.*}" \
              bash /disk-images.sh /work openstack "ostree-image-signed:docker://${repository}:${IMAGE_TAG}"
            sudo mv "${work}/fedora-coreos-openstack.x86_64.qcow2" "${RUNNER_TEMP}/disk/${image%-*-*}-openstack.x86_64.qcow2"
            sudo rm -rf "${work}"
          }
          disk "${ID}"
          if [[ ${GPU_DISK:-} != failed ]] && jq -e --arg id "${GPU_ID}" '.["disk-image"] | index($id)' <<< "${CHANGED}" > /dev/null; then
            if ! bash -euo pipefail -c "$(declare -f disk); disk ${GPU_ID}"; then
              echo "::error::the ${GPU_ID} disk image failed: this release has no GPU disk image"
              echo GPU_DISK=failed >> "${GITHUB_ENV}"
            fi
          fi
          sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/disk"
      # Provenance of the qcow2 files (workflow, commit, run): check it with
      # gh attestation verify <file> -R <owner>/<repo>.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ runner.temp }}/disk/*.qcow2
          create-storage-record: false
      # A release asset must be under 2 GiB. gh creates a release as a draft,
      # uploads, then publishes it, and deletes the draft if an upload fails:
      # a published release always has its disks. A re-run replaces the assets
      # of its release, or publishes the draft a killed run left.
      # Outside the checkout, gh finds no repository: GH_REPO names it.
      - working-directory: ${{ runner.temp }}/disk
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |-
          release="fedora-coreos-${BASE_VERSION}-v${KUBERNETES_VERSION}-${GITHUB_SHA::7}"
          assets=()
          for asset in *.qcow2; do
            size="$(stat -c %s "${asset}")"
            if ((size >= 2 * 1024 ** 3)); then
              # Only fedora-coreos's disk is required: the GPU one is left out.
              if [[ ${asset} == fedora-coreos-nvidia-* ]]; then
                echo "::error::${asset} is ${size} bytes, a release asset must be under 2 GiB: left out"
                echo GPU_DISK=failed >> "${GITHUB_ENV}"
                continue
              fi
              echo "::error::${asset} is ${size} bytes, a release asset must be under 2 GiB"
              exit 1
            fi
            sha256sum "${asset}" > "${asset}.sha256"
            assets+=("${asset}" "${asset}.sha256")
          done
          if gh release view "${release}" > /dev/null 2>&1; then
            gh release upload --clobber "${release}" "${assets[@]}"
            gh release edit "${release}" --draft=false
          else
            gh release create "${release}" --target "${GITHUB_SHA}" --title "${release}" "${assets[@]}" \
              --notes "OpenStack disk images of \`ghcr.io/spnngl/images/fedora-coreos:${IMAGE_TAG}\` and, when it has one, of \`fedora-coreos-nvidia:${IMAGE_TAG}\` (the GPU nodes'): Fedora CoreOS ${BASE_VERSION}, Kubernetes ${KUBERNETES_VERSION}, commit ${GITHUB_SHA}. A node made from one follows its tag with \`bootc upgrade\`. Check a download with \`sha256sum -c <asset>.sha256\` and \`gh attestation verify <asset> -R ${GITHUB_REPOSITORY}\`."
          fi
      # The newest 3 published releases of the line stay, older ones go with
      # their tags. Drafts killed runs left go too; they have no tag yet.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          releases="$(gh release list --limit 100 --json tagName,createdAt,isDraft |
            jq -c --arg line "${KUBERNETES_VERSION%.*}" '[.[] | select(.tagName | startswith("fedora-coreos-") and contains("-v" + $line + "."))]')"
          jq -r '[.[] | select(.isDraft | not)] | sort_by(.createdAt) | reverse | .[3:][].tagName' <<< "${releases}" |
            while read -r old; do
              gh release delete "${old}" --cleanup-tag --yes
            done
          jq -r '.[] | select(.isDraft).tagName' <<< "${releases}" |
            while read -r draft; do
              gh release delete "${draft}" --yes
            done
      # Last: the line's release is out, the GPU disk's failure shows.
      - if: env.GPU_DISK == 'failed'
        run: exit 1

  # The qcow2 of each fedora and almalinux image that changed, from the
  # signed image just pushed: booted in qemu with a throwaway SSH key before
  # it is released, so that no disk that doesn't boot is published. One
  # release per image and push, the newest 3 per tag kept. amd64 only, like
  # the nodes. The disk carries no user: the test hands the VM its key as a
  # systemd credential (bootc/REFERENCES.md, "Disks carry no user").
  release-os:
    name: release ${{ matrix.target.id }}
    needs:
      - discover
      - push
    if: >-
      !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.push.result != 'skipped' && needs.discover.outputs.disks != '[]'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # The qcow2's build provenance attestation, as the push job's.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.disks) }}
    env:
      ITEM: ${{ toJSON(matrix.target) }}
      ID: ${{ matrix.target.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The push job's marker: a release of an image that wasn't pushed would
      # build a disk of the previous one.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pushed_${{ matrix.target.id }}
          path: ${{ runner.temp }}/pushed

      # osbuild keeps a raw disk and two trees of the image: room from the
      # runner's preinstalled SDKs, unused here. Ubuntu's AppArmor profile
      # bwrap-userns-restrict denies capabilities to osbuild's stages inside
      # the privileged container (bootc/fedora-coreos/REFERENCES.md): unloaded
      # on this throwaway runner. KVM for every user, as the VM tests do.
      - run: |-
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo apparmor_parser --remove /etc/apparmor.d/bwrap-userns-restrict
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          df -h /

      # The pushed image, by digest (the tag may have moved) and checked with
      # the policy.json it ships, as the push job does, into rootful
      # podman's storage under its tag: build.sh builds the disk from there,
      # and its origin stays the tag, which hosts follow.
      - run: |-
          tag="$(jq -r '.tags[0]' <<< "${ITEM}")"
          dir="$(jq -r '.file | sub("/[^/]*$"; "")' <<< "${ITEM}")"
          signing=bootc/fedora/sysroot/common
          policy="${dir}/sysroot/$(jq -r .args.BASE_VERSION <<< "${ITEM}")/etc/containers/policy.json"
          sudo install -D -m 0644 -t /etc/containers/registries.d/ "${signing}/etc/containers/registries.d/spnngl-images.yaml"
          sudo install -D -m 0644 -t /usr/share/pki/containers/ "${signing}/usr/share/pki/containers/spnngl-images.pub"
          digest="$(docker buildx imagetools inspect --format '{{ json .Manifest }}' "${tag}" | jq -r .digest)"
          sudo podman pull --platform linux/amd64 --signature-policy "${policy}" "${tag%:*}@${digest}"
          sudo podman tag "${tag%:*}@${digest}" "${tag}"
      - run: |-
          sudo SKIP_BUILD=1 bootc/build.sh "${ID}"
          sudo chown -R "$(id -u):$(id -g)" output
          ls -lh "output/${ID}"
          df -h /

      # Boot test: the VM's sshd listens on 42022 and reads one fixed file
      # (bootc/fedora/sysroot/common/etc/ssh/sshd_config.d/10-myssh.conf), so
      # the credential tmpfiles.extra writes the key and a drop-in named before
      # it, whose value wins. The key is per run and the disk has none.
      - run: |-
          ssh-keygen -q -t ed25519 -N '' -C release-test -f "${RUNNER_TEMP}/key"
          tmpfiles="d /root/.ssh 0700 root root -
          f+ /root/.ssh/authorized_keys 0600 root root - $(< "${RUNNER_TEMP}/key.pub")
          f+ /etc/ssh/sshd_config.d/05-test.conf 0644 root root - AuthorizedKeysFile /root/.ssh/authorized_keys"
          qemu-system-x86_64 -enable-kvm -cpu host -m 4096 -smp 2 -display none -daemonize \
            -serial "file:${RUNNER_TEMP}/console.log" \
            -drive "file=output/${ID}/${ID}.qcow2,if=virtio,format=qcow2,snapshot=on" \
            -netdev user,id=n,hostfwd=tcp::2222-:42022 -device virtio-net-pci,netdev=n \
            -smbios "type=11,value=io.systemd.credential.binary:tmpfiles.extra=$(base64 -w0 <<< "${tmpfiles}")"
          for _ in $(seq 1 60); do
            if ssh -i "${RUNNER_TEMP}/key" -p 2222 -o BatchMode=yes -o ConnectTimeout=5 \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@127.0.0.1 bootc status; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::${ID}: no SSH login in the booted disk"
          tail -n 80 "${RUNNER_TEMP}/console.log"
          exit 1

      # Provenance of the qcow2 (workflow, commit, run): check it with
      # gh attestation verify <file> -R <owner>/<repo>.
      - run: |-
          mkdir "${RUNNER_TEMP}/disk"
          mv "output/${ID}/${ID}.qcow2" "${RUNNER_TEMP}/disk/"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ${{ runner.temp }}/disk/*.qcow2
          create-storage-record: false

      # A release asset must be under 2 GiB. gh creates a release as a draft,
      # uploads, then publishes it: a published release always has its disk.
      # A re-run replaces the asset, or publishes the draft a killed run left.
      # Outside the checkout, gh finds no repository: GH_REPO names it.
      # The newest 3 releases of the image's tag stay, older ones go with
      # their tags, and drafts killed runs left.
      - working-directory: ${{ runner.temp }}/disk
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |-
          tag="$(jq -r '.tags[0]' <<< "${ITEM}")"
          name="$(sed 's|^.*/||; s|:|-|' <<< "${tag}")"
          release="${name}-${GITHUB_SHA::7}"
          asset="${ID}.qcow2"
          size="$(stat -c %s "${asset}")"
          if ((size >= 2 * 1024 ** 3)); then
            echo "::error::${asset} is ${size} bytes, a release asset must be under 2 GiB"
            exit 1
          fi
          sha256sum "${asset}" > "${asset}.sha256"
          if gh release view "${release}" > /dev/null 2>&1; then
            gh release upload --clobber "${release}" "${asset}" "${asset}.sha256"
            gh release edit "${release}" --draft=false
          else
            gh release create "${release}" --target "${GITHUB_SHA}" --title "${release}" "${asset}" "${asset}.sha256" \
              --notes "qcow2 disk image of \`${tag}\`, commit ${GITHUB_SHA}, booted in a test VM before this release. It has no user and no SSH key: give them at first boot (bootc/REFERENCES.md, \"Disks carry no user\"). A host made from it follows the tag with \`bootc upgrade\`. Check the download with \`sha256sum -c ${asset}.sha256\` and \`gh attestation verify ${asset} -R ${GITHUB_REPOSITORY}\`."
          fi
          releases="$(gh release list --limit 100 --json tagName,createdAt,isDraft |
            jq -c --arg name "${name}" '[.[] | select(.tagName | startswith($name + "-"))]')"
          jq -r '[.[] | select(.isDraft | not)] | sort_by(.createdAt) | reverse | .[3:][].tagName' <<< "${releases}" |
            while read -r old; do
              gh release delete "${old}" --cleanup-tag --yes
            done
          jq -r '.[] | select(.isDraft).tagName' <<< "${releases}" |
            while read -r draft; do
              gh release delete "${draft}" --yes
            done
