# The shipped image's own tests, after containers/structure-test.yaml
# (.github/actions/bake-test/test.sh). A big image: its runtime contract
# too (containers/AGENTS.md, "Tests"); the reasons are in its header.
schemaVersion: 2.0.0
metadataTest:
  user: "65532:65532"
  exposedPorts: ["8080"]
  entrypoint: ["/static-web-server"]
  envVars:
    - key: SERVER_ROOT
      value: "/app"
    - key: SERVER_FALLBACK_PAGE
      value: "/app/index.html"
    - key: SERVER_PORT
      value: "8080"
    - key: SERVER_HEALTH
      value: "true"
    - key: SERVER_CACHE_CONTROL_HEADERS
      value: "false"
    - key: SERVER_COMPRESSION_STATIC
      value: "true"
    - key: SERVER_LOG_LEVEL
      value: "info"
    - key: SERVER_CONFIG_FILE
      value: "/sws.toml"
fileExistenceTests:
  # What the image runs: root's, not writable by the image's user.
  - name: "static-web-server"
    path: /static-web-server
    shouldExist: true
    uid: 0
    gid: 0
    permissions: "-rwxr-xr-x"
  # Shell-less (containers/AGENTS.md, "Rules").
  - name: /bin/sh
    path: /bin/sh
    shouldExist: false
  - name: license
    path: /usr/share/doc/sable-next/LICENSE
    shouldExist: true
commandTests:
  - name: "static-web-server --version"
    command: /static-web-server
    args: ["--version"]
