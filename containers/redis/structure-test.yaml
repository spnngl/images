# The shipped image's own tests, after containers/structure-test.yaml
# (.github/actions/bake-test/test.sh). A big image: its runtime contract
# too (containers/AGENTS.md, "Tests"); the reasons are in its header.
schemaVersion: 2.0.0
metadataTest:
  user: "65532:65532"
  exposedPorts: ["6379"]
  volumes: ["/data", "/etc/redis"]
  entrypoint: ["/usr/local/bin/redis-server"]
  cmd: ["/etc/redis/redis.conf"]
  workdir: "/data"
fileExistenceTests:
  # What the image runs: root's, not writable by the image's user.
  - name: "redis-server"
    path: /usr/local/bin/redis-server
    shouldExist: true
    uid: 0
    gid: 0
    permissions: "-rwxr-xr-x"
  # Shell-less (containers/AGENTS.md, "Rules").
  - name: /bin/sh
    path: /bin/sh
    shouldExist: false
  - name: license
    path: /usr/share/doc/redis
    shouldExist: true
commandTests:
  # redis-cli finds its libraries here: one distroless lacks fails it.
  - name: "redis-cli --version"
    command: /usr/local/bin/redis-cli
    args: ["--version"]
