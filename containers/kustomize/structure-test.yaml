# The shipped image's own tests, after containers/structure-test.yaml
# (.github/actions/bake-test/test.sh). A big image: its runtime contract
# too (containers/AGENTS.md, "Tests"); the reasons are in its header.
schemaVersion: 2.0.0
metadataTest:
  user: "65532:65532"
  entrypoint: ["/usr/bin/kustomize"]
  workdir: "/src"
fileExistenceTests:
  # What the image runs: root's, not writable by the image's user.
  - name: "kustomize"
    path: /usr/bin/kustomize
    shouldExist: true
    uid: 0
    gid: 0
    permissions: "-rwxr-xr-x"
  # Shell-less (containers/AGENTS.md, "Rules").
  - name: /bin/sh
    path: /bin/sh
    shouldExist: false
  - name: license
    path: /usr/share/doc/kustomize/LICENSE
    shouldExist: true
commandTests:
  # kustomize runs on this platform (the build stage tested
  # both binaries).
  - name: "kustomize version"
    command: /usr/bin/kustomize
    args: ["version"]
