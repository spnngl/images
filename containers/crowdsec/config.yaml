# CrowdSec's config, installed as /etc/crowdsec/config.yaml: upstream's
# Docker one (build/docker/config.yaml), with this image's paths. Change
# it with a config.yaml.local next to it, deep-merged over it (or ${VAR}
# references, expanded from the environment): mounting it keeps this
# file's updates.
common:
  log_media: stdout
  log_level: info
  log_dir: /var/log/
config_paths:
  config_dir: /etc/crowdsec/
  data_dir: /var/lib/crowdsec/data/
  simulation_path: /etc/crowdsec/simulation.yaml
  hub_dir: /etc/crowdsec/hub/
  index_path: /etc/crowdsec/hub/.index.json
  notification_dir: /etc/crowdsec/notifications/
  # Root's: crowdsec only runs plugins owned by its own user.
  plugin_dir: /usr/lib/crowdsec/plugins/
crowdsec_service:
  acquisition_path: /etc/crowdsec/acquis.yaml
  acquisition_dir: /etc/crowdsec/acquis.d
  parser_routines: 1
# The user crowdsec (root) runs the plugins as. Debian's nobody has the
# nogroup group, not a nobody one.
plugin_config:
  user: nobody
  group: nogroup
cscli:
  output: human
db_config:
  log_level: info
  type: sqlite
  db_path: /var/lib/crowdsec/data/crowdsec.db
  flush:
    max_items: 5000
    max_age: 7d
  use_wal: false
api:
  client:
    insecure_skip_verify: false
    credentials_path: /etc/crowdsec/local_api_credentials.yaml
  server:
    log_level: info
    listen_uri: 0.0.0.0:8080
    profiles_path: /etc/crowdsec/profiles.yaml
    trusted_ips: # IP ranges, or IPs which can have admin API access
      - 127.0.0.1
      - ::1
    online_client: # Central API credentials (to push signals and receive bad IPs)
    #credentials_path: /etc/crowdsec/online_api_credentials.yaml
    tls:
      agents_allowed_ou:
        - agent-ou
      bouncers_allowed_ou:
        - bouncer-ou
prometheus:
  enabled: true
  level: full
  listen_addr: 0.0.0.0
  listen_port: 6060
