# The shipped image's own tests, after containers/structure-test.yaml
# (.github/actions/bake-test/test.sh). A big image: its runtime contract
# too (containers/AGENTS.md, "Tests"); the reasons are in its header.
schemaVersion: 2.0.0
metadataTest:
  user: "65532:65532"
  exposedPorts: ["5000"]
  volumes: ["/var/lib/registry"]
  entrypoint: ["/usr/bin/zot"]
  cmd: ["serve", "/etc/zot/config.json"]
fileExistenceTests:
  # What the image runs: root's, not writable by the image's user.
  - name: "zot"
    path: /usr/bin/zot
    shouldExist: true
    uid: 0
    gid: 0
    permissions: "-rwxr-xr-x"
  # Shell-less (containers/AGENTS.md, "Rules").
  - name: /bin/sh
    path: /bin/sh
    shouldExist: false
  - name: license
    path: /usr/share/doc/zot/LICENSE
    shouldExist: true
commandTests:
  # The binary runs on this platform (the build stage tested the
  # server).
  - name: "zot --version"
    command: /usr/bin/zot
    args: ["--version"]
