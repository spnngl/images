# The Containerfile's smoke test: `haproxy -c` loads this Lua file. A
# listener, or -c exits 2 ("will not start").
global
    lua-load /tmp/smoke-test.lua

defaults
    mode http
    timeout connect 5s
    timeout client 5s
    timeout server 5s

frontend smoke-test
    bind :8080
    http-request return status 200
