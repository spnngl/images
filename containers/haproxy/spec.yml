# syntax=ghcr.io/project-dalec/dalec/frontend:0.22.1
#
# HAProxy (https://www.haproxy.org) built with Dalec
# (https://project-dalec.github.io/dalec/): one Debian trixie package,
# installed into the minimal image of the trixie/container target with
# the libraries it links and Debian's Lua modules. One image per release
# line (docker-bake.hcl).
#
# Runtime contract: UID/GID 99 (AGENTS.md), no passwd entry. A config in
# /etc/haproxy (a volume, none shipped), the master process in the
# foreground (-db). Ports: 1936 stats, 8080 HTTP, 8443 HTTPS, 9101
# Prometheus, as the configs of the deployments use them (Dalec has no
# EXPOSE equivalent).

# Set by docker-bake.hcl; empty here, Dalec needs them declared
# (containers/AGENTS.md).
args:
  BASE_VERSION: ""
  # The commit of the BASE_VERSION tag.
  BASE_CHECKSUM: ""

name: haproxy
description: Reliable, high performance TCP/HTTP load balancer
website: https://www.haproxy.org
license: GPL-2.0-or-later
packager: spnngl/images
vendor: spnngl/images
version: ${BASE_VERSION}
revision: 1

sources:
  haproxy:
    git:
      # One repository per release line: haproxy-<major>.<minor>.git.
      url: https://git.haproxy.org/git/haproxy-${BASE_VERSION%.*}.git
      commit: v${BASE_VERSION}
      # The tag must resolve to this commit: tags can be moved.
      checksum: ${BASE_CHECKSUM}

dependencies:
  build:
    build-essential: {}
    libcrypt-dev: {}
    liblua5.4-dev: {}
    libpcre2-dev: {}
    libssl-dev: {}
  # The linked libraries come from the package's shlibs; Lua modules
  # are loaded by the configs, not linked.
  runtime:
    lua-json: {}
    # Not used by HAProxy: Dalec 0.22.1 purges it before its last dpkg
    # run, which then fails and leaves the shell in the image.
    # TODO: drop when Dalec keeps the libraries dpkg links.
    libmd0: {}

build:
  env:
    # Dalec expands args in env, not in the command.
    BASE_VERSION: ${BASE_VERSION}
    # No haproxy-dbgsym package: the image would install it.
    DEB_BUILD_OPTIONS: noautodbgsym
  # Steps run with sh (dash) from the folder holding one folder per source.
  steps:
    # The official image's options (docker-library/haproxy), QUIC on
    # every line: 2.8 and 3.0 lack native QUIC on OpenSSL, so they get
    # the compatibility layer (no 0-RTT). Upstream's defaults for the
    # rest: libcrypt (encrypted userlist passwords), SLZ (compression),
    # DEBUG (runtime checks). -vv puts the build options in the build log.
    # https://github.com/haproxy/haproxy/blob/master/INSTALL
    - command: |
        cd haproxy
        case "${BASE_VERSION}" in
          2.* | 3.0.*) quic_compat=USE_QUIC_OPENSSL_COMPAT=1 ;;
          *) quic_compat= ;;
        esac
        make -j"$(nproc)" TARGET=linux-glibc USE_GETADDRINFO=1 \
          USE_LUA=1 LUA_INC=/usr/include/lua5.4 USE_OPENSSL=1 USE_QUIC=1 \
          USE_PCRE2=1 USE_PCRE2_JIT=1 USE_PROMEX=1 USE_PTHREAD_EMULATION=1 \
          ${quic_compat}
        ./haproxy -vv

artifacts:
  binaries:
    haproxy/haproxy: {}
  # Owned by UID/GID 99, the image's user.
  createDirectories:
    config:
      haproxy:
        user: "99"
        group: "99"
    state:
      haproxy:
        user: "99"
        group: "99"
  licenses:
    # Declaring it also makes trixie/container keep /usr/share/doc, so
    # the Debian packages' copyright files stay too.
    haproxy/LICENSE: {}

image:
  entrypoint: /usr/bin/haproxy
  cmd: -db -f /etc/haproxy
  # Numeric, so runAsNonRoot can check it.
  user: "99:99"
  working_dir: /var/lib/haproxy
  volumes:
    /etc/haproxy: {}
  # Soft stop: listeners close, connections drain.
  stop_signal: SIGUSR1
  labels:
    org.opencontainers.image.title: HAProxy
    org.opencontainers.image.version: ${BASE_VERSION}
    org.opencontainers.image.licenses: GPL-2.0-or-later
    org.opencontainers.image.source: https://github.com/spnngl/images

tests:
  - name: haproxy runs
    steps:
      - command: /usr/bin/haproxy -v
        stdout:
          contains:
            - HAProxy version ${BASE_VERSION}
  # The config loads lua-json, and lua-lpeg under it; -c exits non-zero
  # on an error. A listener, or -c exits 2 ("will not start").
  - name: haproxy loads lua-json
    mounts:
      - dest: /tmp/smoke-test
        spec:
          inline:
            dir:
              files:
                smoke-test.lua:
                  contents: |
                    local json = require("json")
                    assert(json.encode({ 1 }) == "[1]")
                smoke-test.cfg:
                  contents: |
                    global
                        lua-load /tmp/smoke-test/smoke-test.lua
                    defaults
                        mode http
                        timeout connect 5s
                        timeout client 5s
                        timeout server 5s
                    frontend smoke-test
                        bind :8080
                        http-request return status 200
    steps:
      - command: /usr/bin/haproxy -c -f /tmp/smoke-test/smoke-test.cfg
