# Smoke test of the image (Containerfile): lua-json through Lua, over
# HTTP/1.1 and HTTP/3, and the Prometheus exporter, on loopback; the
# image's Cloudflare lists, as an ACL (loopback isn't in them); ipverse's
# AS and country lists, as ACLs on the X-Smoke-Test-Src header's address.
# /tmp/smoke-test.pem: a throwaway certificate the build stage makes.
global
    # 3.1 and later warn when it's unset; before a lua-load.
.if version_atleast(3.1)
    tune.lua.bool-sample-conversion normal
.endif
    lua-load /smoke-test/smoke-test.lua
    # QUIC listeners on OpenSSL's compatibility layer (2.8, 3.0).
.if feature(QUIC_OPENSSL_COMPAT)
    limited-quic
.endif

defaults
    mode http
    timeout connect 5s
    timeout client 5s
    timeout server 5s

frontend smoke-test
    bind 127.0.0.1:8080
    bind quic4@127.0.0.1:8443 ssl crt /tmp/smoke-test.pem alpn h3
    acl cloudflare src -f /data/lists/cloudflare/ips-v4 -f /data/lists/cloudflare/ips-v6
    http-request deny if cloudflare
    acl as13335 req.hdr_ip(x-smoke-test-src) -f /data/lists/as/13335/ipv4-aggregated.txt -f /data/lists/as/13335/ipv6-aggregated.txt
    acl country_au req.hdr_ip(x-smoke-test-src) -f /data/lists/country/au/ipv4-aggregated.txt -f /data/lists/country/au/ipv6-aggregated.txt
    http-request return status 200 content-type text/plain string "AS13335 AU" if as13335 country_au
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 200 content-type application/json lf-string "%[lua.smoke_test]"
