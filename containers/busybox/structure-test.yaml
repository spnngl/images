# The shipped image's own tests, after containers/structure-test.yaml
# (.github/actions/bake-test/test.sh).
schemaVersion: 2.0.0
commandTests:
  # The binary is static and runs on this platform (the build
  # stage tested the applets), and the image's user has a name.
  - name: "busybox runs, its user has a name"
    command: /bin/sh
    args: ["-c", "busybox --version && [ \"$(whoami)\" = nonroot ]"]
