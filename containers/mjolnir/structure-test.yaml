# The shipped image's own tests, after containers/structure-test.yaml
# (.github/actions/bake-test/test.sh). A big image: its runtime contract
# too (containers/AGENTS.md, "Tests"); the reasons are in its header.
schemaVersion: 2.0.0
metadataTest:
  user: "65532:65532"
  volumes: ["/data"]
  entrypoint: ["/nodejs/bin/node", "/mjolnir/index.js"]
  workdir: "/mjolnir"
  envVars:
    - key: NODE_ENV
      value: "production"
    - key: NODE_CONFIG_DIR
      value: "/data/config"
fileExistenceTests:
  # What the image runs: root's, not writable by the image's user.
  - name: "node"
    path: /nodejs/bin/node
    shouldExist: true
    uid: 0
    gid: 0
    permissions: "-r-xr-xr-x"
  # Shell-less (containers/AGENTS.md, "Rules").
  - name: /bin/sh
    path: /bin/sh
    shouldExist: false
  - name: license
    path: /usr/share/doc/mjolnir/LICENSE
    shouldExist: true
commandTests:
  # The addons load against this image's libraries, and its Node meets
  # upstream's range (>=<major>.0.0: another form fails, to be read).
  - name: "addons load, Node in range"
    command: /nodejs/bin/node
    args: ["-e", "require('@tensorflow/tfjs-node'); require('@matrix-org/matrix-sdk-crypto-nodejs'); const m = /^>=(\\d+)\\.0\\.0$/.exec(require('./package.json').engines.node); if (!m || Number(process.versions.node.split('.')[0]) < Number(m[1])) process.exit(1)"]
