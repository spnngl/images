# The shipped image's own tests, after containers/structure-test.yaml
# (.github/actions/bake-test/test.sh). A big image: its runtime contract
# too (containers/AGENTS.md, "Tests"); the reasons are in its header.
schemaVersion: 2.0.0
metadataTest:
  user: "65532:65532"
  exposedPorts: ["7878"]
  volumes: ["/config"]
  entrypoint: ["/usr/lib/radarr/bin/Radarr"]
  cmd: ["-nobrowser", "-data=/config"]
  workdir: "/config"
  envVars:
    - key: Radarr__Log__AnalyticsEnabled
      value: "false"
    - key: DOTNET_EnableDiagnostics
      value: "0"
fileExistenceTests:
  # What the image runs: root's, not writable by the image's user.
  - name: "Radarr"
    path: /usr/lib/radarr/bin/Radarr
    shouldExist: true
    uid: 0
    gid: 0
    permissions: "-rwxr-xr-x"
  # Shell-less (containers/AGENTS.md, "Rules").
  - name: /bin/sh
    path: /bin/sh
    shouldExist: false
  - name: license
    path: /usr/share/doc/radarr/LICENSE
    shouldExist: true
commandTests:
  # The archive's ffprobe, a static binary: it runs on this platform.
  - name: "ffprobe -version"
    command: /usr/lib/radarr/bin/ffprobe
    args: ["-version"]
