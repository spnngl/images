# The shipped image's own tests, after containers/structure-test.yaml
# (.github/actions/bake-test/test.sh). A big image: its runtime contract
# too (containers/AGENTS.md, "Tests"); the reasons are in its header.
schemaVersion: 2.0.0
metadataTest:
  user: "65532:65532"
  exposedPorts: ["6060", "9000"]
  entrypoint: ["/usr/bin/crowdsec-spoa-bouncer"]
  cmd: ["-c", "/etc/crowdsec/bouncers/crowdsec-spoa-bouncer.yaml"]
fileExistenceTests:
  # What the image runs: root's, not writable by the image's user.
  - name: "crowdsec-spoa-bouncer"
    path: /usr/bin/crowdsec-spoa-bouncer
    shouldExist: true
    uid: 0
    gid: 0
    permissions: "-rwxr-xr-x"
  # Shell-less (containers/AGENTS.md, "Rules").
  - name: /bin/sh
    path: /bin/sh
    shouldExist: false
  - name: license
    path: /usr/share/doc/cs-haproxy-spoa-bouncer/LICENSE
    shouldExist: true
commandTests:
  # The binary runs on this platform (the build stage tested the
  # bouncer).
  - name: "crowdsec-spoa-bouncer --version"
    command: /usr/bin/crowdsec-spoa-bouncer
    args: ["--version"]
