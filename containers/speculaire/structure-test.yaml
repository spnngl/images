# The shipped image's own tests, after containers/structure-test.yaml
# (.github/actions/bake-test/test.sh).
schemaVersion: 2.0.0
commandTests:
  # The binary runs on this platform (the build stage tested it).
  - name: "speculaire version"
    command: /usr/bin/speculaire
    args: ["version"]
    expectedOutput: ["^speculaire \\d+\\.\\d+\\.\\d+ \\S+-linux-musl\\n?$"]
