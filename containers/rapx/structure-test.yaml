# The shipped image's own tests, after containers/structure-test.yaml
# (.github/actions/bake-test/test.sh). A big image: its runtime contract
# too (containers/AGENTS.md, "Tests"); the reasons are in its header.
schemaVersion: 2.0.0
metadataTest:
  user: "65532:65532"
  entrypoint: ["/usr/local/bin/cargo", "rapx"]
  cmd: ["--help"]
  workdir: "/src"
  envVars:
    - key: CARGO_HOME
      value: "/var/cache/cargo"
fileExistenceTests:
  # What the image runs: root's, not writable by the image's user.
  - name: "cargo"
    path: /usr/local/bin/cargo
    shouldExist: true
    uid: 0
    gid: 0
    permissions: "-rwxr-xr-x"
  # Shell-less (containers/AGENTS.md, "Rules").
  - name: /bin/sh
    path: /bin/sh
    shouldExist: false
  - name: license
    path: /usr/share/doc/rapx/MPL-2.0
    shouldExist: true
