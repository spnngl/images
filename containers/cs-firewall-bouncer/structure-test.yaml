# The shipped image's own tests, after containers/structure-test.yaml
# (.github/actions/bake-test/test.sh). A big image: its runtime contract
# too (containers/AGENTS.md, "Tests"); the reasons are in its header.
schemaVersion: 2.0.0
metadataTest:
  exposedPorts: ["60601"]
  entrypoint: ["/usr/bin/crowdsec-firewall-bouncer"]
  cmd: ["-c", "/etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml"]
fileExistenceTests:
  # What the image runs: root's, not writable by the image's user.
  - name: "crowdsec-firewall-bouncer"
    path: /usr/bin/crowdsec-firewall-bouncer
    shouldExist: true
    uid: 0
    gid: 0
    permissions: "-rwxr-xr-x"
  # Shell-less (containers/AGENTS.md, "Rules").
  - name: /bin/sh
    path: /bin/sh
    shouldExist: false
commandTests:
  # The binary runs on this platform and the shipped config parses.
  # -T, not -t (AGENTS.md, Rules).
  - name: "shipped config parses"
    command: /usr/bin/crowdsec-firewall-bouncer
    args: ["-c", "/etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml", "-T"]
