apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
featureGates:
  HPAScaleToZero: true
  PodAndContainerStatsFromCRI: true
failSwapOn: false
# Hosts swap on zram (usr/lib/systemd/zram-generator.conf.d/50-k3s.conf).
# LimitedSwap: a Burstable container may swap up to
# <memory request> / <node RAM> * <swap size>. Critical pods, BestEffort,
# Guaranteed, and containers with request = limit or no memory request
# never swap (pkg/kubelet/kuberuntime/kuberuntime_container_linux.go:
# GetContainerSwapBehavior).
memorySwap:
  swapBehavior: LimitedSwap
maxPods: 256
# Subtracted from the node's allocatable, and so from pod requests and
# kubepods.slice's limit, for everything outside it: the system and
# kube.slice (k3s, CRI-O). Without it pods could take all the RAM: a
# control plane short of memory stalls its API server, failing the
# liveness probes that call it. enforceNodeAllocatable stays ["pods"]:
# no cgroup caps the daemons. One value for every role.
# https://kubernetes.io/docs/tasks/administer-cluster/reserve-compute-resources/#system-reserved
systemReserved:
  cpu: 100m
  memory: 128Mi
podPidsLimit: -1
serializeImagePulls: false
maxParallelImagePulls: 10
seccompDefault: true
# Lot of stuff to tweak to enable it
protectKernelDefaults: false
tlsMinVersion: VersionTLS12
healthzBindAddress: 127.0.0.1
healthzPort: 10248
readOnlyPort: 0
cgroupsPerQOS: true
cgroupRoot: /
# Run only on cgroupv2
failCgroupV1: true
