# The control-plane's kubelet only: config.yaml, next to this file, passes
# it with kubelet-arg config=, and k3s copies it into the kubelet's
# drop-in directory at each start, as 10-cli-config.conf. Here, not in
# /var/lib/rancher/k3s/agent/etc/kubelet.conf.d, so that it is updated
# with the image; agents replace config.yaml and never read it.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
# On top of systemReserved (kubelet.conf.d/20-my-kubelet.conf), for the
# server, kube.slice's largest process: 1.7-1.9GiB on a 3.8GiB node.
# Reserving all of it would leave pods ~1.6GiB of allocatable; 1Gi
# leaves ~2.5GiB (2.2GiB requested when set) and keeps pod requests
# further from the node's RAM. Like systemReserved it caps
# kubepods.slice, not k3s.
# https://kubernetes.io/docs/tasks/administer-cluster/reserve-compute-resources/#kube-reserved
kubeReserved:
  cpu: 200m
  memory: 1Gi
