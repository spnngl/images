# kine's compaction timeout, 5s by default (--compact-timeout), read from the
# environment when k3s builds kine's config. A compaction that outlives it
# stops the server: the transaction is rolled back on the deadline, then kine's
# commit fails with sql.ErrTxDone, which is fatal. See bootc/k3s/REFERENCES.md.
[Service]
Environment=KINE_COMPACT_TIMEOUT=60s
