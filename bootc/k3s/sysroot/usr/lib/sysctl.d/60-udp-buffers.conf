# Socket buffer ceilings, in bytes, for UDP media servers (LiveKit).
# https://docs.kernel.org/admin-guide/sysctl/net.html
#
# A socket's SO_RCVBUF / SO_SNDBUF request is capped at rmem_max /
# wmem_max, 212992 by default. LiveKit's UDP mux asks for 16 MiB both ways
# and warns below 5000000 (livekit/mediatransportutil pkg/rtcconfig):
# under load the kernel drops media packets that a full buffer can't hold.
# A ceiling only: other sockets keep the rmem_default / wmem_default size.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
