Port 42022
AddressFamily inet
UseDNS yes
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no
# Key-only root login: hosts installed with `bootc install to-existing-root`
# get no blueprint, hence no other user. Passwords are refused anyway
# (PasswordAuthentication, AuthenticationMethods). Once a user exists,
# turn it off in a machine-local drop-in named before this file, as sshd
# keeps a keyword's first value: `PermitRootLogin no` in
# /etc/ssh/sshd_config.d/05-after-install.conf. Editing this file instead
# would keep every later image change to it off the host.
PermitRootLogin prohibit-password
MaxAuthTries 3
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
ClientAliveInterval 300
AllowAgentForwarding no
X11Forwarding no
IgnoreRhosts yes
AuthenticationMethods publickey
AllowTcpForwarding no
DisableForwarding yes
ForceCommand none
GatewayPorts no

# Yeah i know, all is mine.
AuthorizedKeysFile /usr/ssh/authorized_keys.d/keys
