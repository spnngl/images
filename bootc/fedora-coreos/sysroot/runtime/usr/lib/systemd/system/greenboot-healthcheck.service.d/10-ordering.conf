# The checks (usr/lib/greenboot/check/required.d) wait for containerd: start
# them once it is up, so that the checks' timeouts measure the node, not the
# boot. A flavor's layer adds its own daemon (kube: 20-kubelet.conf).
# greenboot-default-health-checks' drop-in orders it after the network.
[Unit]
After=containerd.service
