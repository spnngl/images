# Connection tracking, as kube-proxy set it at start (pkg/proxy/conntrack/):
# Cilium replaced kube-proxy, and netfilter still tracks the host's traffic
# and what Cilium's iptables rules see. The module is loaded before this file
# is applied (usr/lib/modules-load.d/10-kubernetes.conf), or these keys don't
# exist yet.
# - max: 4x kube-proxy's cap (32768 per CPU, 1048576 at most), for dense
#   nodes. Entries are allocated when used.
# - buckets: max/4, as kube-proxy sets the module's hashsize. The kernel's
#   default is 262144 past 4 GiB of RAM, 16 entries per bucket when full.
# - TCP timeouts: kube-proxy's, established 1 day (kernel: 5 days), close_wait
#   1 hour (kernel: 60s).
net.netfilter.nf_conntrack_max = 4194304
net.netfilter.nf_conntrack_buckets = 1048576
net.netfilter.nf_conntrack_tcp_timeout_established = 86400
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 3600
