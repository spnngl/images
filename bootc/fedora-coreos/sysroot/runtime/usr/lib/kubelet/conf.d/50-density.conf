# Nodes of ~2000 pods. Applied over the --config file kubeadm or the cluster
# writes (kube layer: kubelet.service.d/20-config-dir.conf), or k3s' own
# (k3s layer: --kubelet-arg=config-dir).
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
# The CRI calls' deadline, 2m by default (RunPodSandbox: twice that). A burst
# of pod starts and stops can hold the pods' network setup and teardown past
# it, queued on the kernel's global RTNL lock: the kubelet gives up and calls
# again, and containerd redoes the work (a new CNI DEL for each
# StopPodSandbox), which lengthens the queue.
runtimeRequestTimeout: 4m
# Log rotation: every 10s, one ContainerStatus call per running container,
# one after the other with the default single worker.
containerLogMaxWorkers: 8
# One image pull at a time by default. containerd's own limit is in
# containerd/conf.d/50-myconf.toml (transfer service).
serializeImagePulls: false
maxParallelImagePulls: 30
