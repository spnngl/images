# systemd manages the cgroups, as containerd's runc does (SystemdCgroup in
# containerd/conf.d/50-myconf.toml): a kubelet on another driver fights it
# for them. kubeadm writes systemd into the --config file, and k3s only does
# for its embedded containerd: with --container-runtime-endpoint it leaves
# cgroupfs (pkg/daemons/agent/agent.go). Applied over the --config file the
# way 50-density.conf is.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd
