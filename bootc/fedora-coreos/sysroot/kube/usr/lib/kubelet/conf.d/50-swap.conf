# The image gives nodes swap on zram, so it lets the kubelet run with it:
# with swap on and failSwapOn, the kubelet exits, greenboot fails and the
# node rolls back. Applied over the --config file kubeadm or the cluster
# writes (kubelet.service.d/20-config-dir.conf).
# LimitedSwap: only Burstable containers whose memory request is below their
# limit swap, up to their request's share of the swap. Guaranteed,
# BestEffort and critical pods (control plane, etcd) don't.
# https://kubernetes.io/docs/concepts/cluster-administration/swap-memory-management/
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
failSwapOn: false
memorySwap:
  swapBehavior: LimitedSwap
