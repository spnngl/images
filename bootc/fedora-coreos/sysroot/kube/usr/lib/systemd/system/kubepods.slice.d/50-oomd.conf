# systemd-oomd kills a container of the pods' slice once swap runs out:
# MemAvailable and free swap both under 10%, the container using the most
# swap, if over 5% of it. Before the kernel's OOM killer, which would act
# on a node already stalled swapping. See systemd-oomd.service(8),
# oomd.conf(5), systemd.resource-control(5).
# Swap only: critical and Guaranteed pods never swap (LimitedSwap,
# usr/lib/kubelet/conf.d/50-swap.conf), so a swap kill can't pick them. A
# memory-pressure kill picks the cgroup reclaiming fastest, blind to pod
# priority and QoS: etcd or the API server could go. Memory pressure stays
# with the kubelet's eviction and the kernel's OOM killer.
# This slice only: oomd kills a whole leaf cgroup, and watching -.slice
# could kill containerd.service, which holds every container's shim.
# kubepods.slice is transient, made by the kubelet: drop-ins apply to it
# all the same.
[Slice]
ManagedOOMSwap=kill
