# Our own config, not the base's /etc/containerd/config.toml (version 2, CNI
# in /usr/libexec/cni): the package's file stays untouched, and ours takes
# drop-ins from /usr/lib/containerd/conf.d and /etc/containerd/conf.d.
# Check the merged result: `containerd config dump --config /usr/lib/containerd/config.toml`.
[Service]
ExecStart=
ExecStart=/usr/bin/containerd --config /usr/lib/containerd/config.toml
