# The image's kubelet settings, /usr/lib/kubelet/conf.d: KubeletConfiguration
# drop-ins, applied in name order over the --config file, whichever kubeadm
# or the cluster passes (kubernetes cmd/kubelet/app/server.go). kubeadm's
# 10-kubeadm.conf sets KUBELET_CONFIG_ARGS and expands it in ExecStart: this
# repeats its value, which test/kube/build.yaml checks, and adds the folder.
[Service]
Environment="KUBELET_CONFIG_ARGS=--config=/var/lib/kubelet/config.yaml --config-dir=/usr/lib/kubelet/conf.d"
