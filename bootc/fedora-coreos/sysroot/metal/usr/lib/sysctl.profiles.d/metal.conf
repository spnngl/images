# Dedicated servers only, applied by sysctl-metal.service: out of
# usr/lib/sysctl.d, which systemd-sysctl applies on every node.
#
# Default receive buffer of the sockets that set none (212992 bytes). The
# Cilium agent's netlink sockets are such sockets: on servers with hundreds of
# interfaces and routes, a burst of events overflows them (ENOBUFS) and the
# agent resyncs its devices and routes. A buffer only takes memory while it
# holds data; TCP sockets size theirs from net.ipv4.tcp_rmem instead.
net.core.rmem_default = 4194304
