# Large machines with Mellanox NICs only, applied by sysctl-mlx5-large.service:
# out of usr/lib/sysctl.d, which systemd-sysctl applies on every node.
#
# Give more time to softirq/softnet to handle all network traffic.
# Fixes SoftnetSqueezedTooHigh: the NET_RX softirq runs out of budget before
# draining the NIC while packets are still pending.
net.core.netdev_budget = 900
net.core.netdev_budget_usecs = 5000
net.core.netdev_max_backlog = 25000
net.core.dev_weight = 128
