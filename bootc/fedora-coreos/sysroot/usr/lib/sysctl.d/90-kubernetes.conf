# What kubeadm and the CNI need, from kubernetes-sigs/image-builder
# (images/capi/ansible/roles/node/tasks/main.yml, "Set and persist kernel
# params"). The net.bridge.* keys exist only once br_netfilter is loaded
# (usr/lib/modules-load.d/10-kubernetes.conf); systemd-sysctl runs after
# systemd-modules-load.
#
# Left out: net.ipv6.conf.all.forwarding, as IPv6 is off (995-ipv6.conf);
# the rest of that role's list is set, with larger values, by 996 to 998.
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1
net.ipv4.ip_forward = 1
vm.overcommit_memory = 1
kernel.panic = 10
kernel.panic_on_oops = 1
# Don't panic on a soft lockup.
kernel.softlockup_panic = 0
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches   = 524288
