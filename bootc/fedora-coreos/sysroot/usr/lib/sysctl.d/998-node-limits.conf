# Limits of a Kubernetes node, every node: the kernel defaults are sized for
# small hosts. inotify runs out first with log tailers on ~2000 pods per node,
# aio for Postgres/Elasticsearch, bpf_jit_limit for Cilium. IPv6 neigh and
# kernel.keys are left out: IPv6 is disabled and nothing hit keys limits.
fs.aio-max-nr = 524288
fs.inotify.max_queued_events = 1048576
fs.inotify.max_user_instances = 1048576
fs.inotify.max_user_watches = 1048576
net.core.bpf_jit_limit = 1000000000
net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 28672
net.ipv4.neigh.default.gc_thresh3 = 32768
vm.max_map_count = 262144
