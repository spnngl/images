# The checks (usr/lib/greenboot/check/required.d) wait for containerd and
# kubelet: start them once those, and the network kubelet needs, are up, so
# that the checks' timeouts measure the node, not the boot. The drop-in that
# orders greenboot after the network is in greenboot-default-health-checks,
# which this image leaves out.
[Unit]
Wants=network-online.target
After=network-online.target containerd.service kubelet.service
