# Fedora's sshd-keygen writes the host keys root:root 0600, and
# scap-security-guide's Fedora check wants group ssh_keys
# (file_groupownership_sshd_private_key). At 0600 the group reads nothing:
# this only keeps the rule checked, until upstream accepts root:
# https://github.com/ComplianceAsCode/content/pull/15310
[Service]
ExecStartPost=/usr/bin/chgrp ssh_keys /etc/ssh/ssh_host_%i_key
