# =============================================================================
# LINUX SERVER KERNEL MODULE BLACKLIST
# =============================================================================
# Purpose: Hardens the Linux kernel by preventing the loading of unused, legacy,
# or insecure kernel modules to minimize the local and remote attack surface.
#
# Note: The 'install [module] /bin/true' directive prevents the module from
# being loaded even if requested as a dependency by another process.
# =============================================================================

# =============================================================================
# 1. STORAGE & HIGH-RISK HARDWARE INTERFACES
# =============================================================================

# Disables USB Mass Storage devices. Prevents physical data exfiltration,
# unauthorized data introduction, and "Rubber Ducky" style USB attacks.
blacklist usb-storage
install usb-storage /bin/true

# Disables USB Attached SCSI Protocol (UASP). Typically used for high-speed
# external USB drives; disabled alongside usb-storage for complete USB blocking.
blacklist uas
install uas /bin/true

# Disables FireWire drivers. FireWire permits Direct Memory Access (DMA),
# which can allow a physical attacker to read/write system memory directly.
blacklist firewire-core
install firewire-core /bin/true

# Disables Thunderbolt support. Like FireWire, Thunderbolt allows DMA,
# exposing the server to direct memory manipulation from rogue peripheral devices.
blacklist thunderbolt
install thunderbolt /bin/true


# =============================================================================
# 2. LEGACY & UNCOMMON FILESYSTEMS
# =============================================================================
# These filesystems are rarely used on production servers but remain in the
# kernel. Historically, parsing code for obscure filesystems has been a fertile
# ground for privilege escalation vulnerabilities via malicious disk images.

# Disables Compressed ROM File System. An old read-only filesystem
# primarily used in embedded architectures.
blacklist cramfs
install cramfs /bin/true

# Disables Veritas FreeVxFS. A legacy commercial filesystem support module
# not needed in standard Linux environments.
blacklist freevxfs
install freevxfs /bin/true

# Disables the old hierarchical filesystem used by classic Apple Macintosh systems.
blacklist hfs
install hfs /bin/true

# Disables the enhanced version of Apple's legacy filesystem (HFS+).
blacklist hfsplus
install hfsplus /bin/true

# Disables Journaling Flash File System v2. Intended specifically for raw
# flash memory devices (like old MTD partitions), not standard server drives.
blacklist jffs2
install jffs2 /bin/true

# Disables Universal Disk Format. Used primarily for optical media like
# DVDs and Blu-ray discs, which are absent or unused on enterprise servers.
blacklist udf
install udf /bin/true


# =============================================================================
# 3. OBSCURE & UNUSED NETWORK PROTOCOLS
# =============================================================================
# Leaving unneeded protocol stacks active expands the network attack surface.
# Vulnerabilities in these subsystem handlers can potentially be triggered remotely.

# Disables Datagram Congestion Control Protocol. A transport layer protocol
# designed for streaming media that has a history of kernel vulnerabilities.
blacklist dccp
install dccp /bin/true

# Disables Stream Control Transmission Protocol. A message-oriented transport
# layer protocol. Disable unless running telecom or highly specific cluster apps.
blacklist sctp
install sctp /bin/true

# Disables Reliable Datagram Sockets. A low-latency, reliable connectionless
# protocol designed for high-performance computing clusters.
blacklist rds
install rds /bin/true

# Disables Transparent Inter-Process Communication. A protocol designed for
# internal cluster node communication, often exploited if exposed.
blacklist tipc
install tipc /bin/true

# Disables the entire Bluetooth protocol stack. Eliminates wireless
# sniffing, pairing, and remote exploit vectors on the server.
blacklist bluetooth
install bluetooth /bin/true

# Disables Amateur Radio AX.25 packet radio protocol. Completely obsolete
# for enterprise data centers.
blacklist ax25
install ax25 /bin/true

# Disables NetRom routing protocol. Used exclusively over AX.25 amateur radio.
blacklist netrom
install netrom /bin/true

# Disables Asynchronous Transfer Mode, a legacy telecom network protocol.
blacklist atm
install atm /bin/true

# Disables Controller Area Network, the bus of cars and industrial devices.
blacklist can
install can /bin/true


# =============================================================================
# 4. MULTIMEDIA & AUDIO SUBSYSTEMS
# =============================================================================
# Production servers do not require sound cards or video capture capabilities.
# Disabling these stops local privilege escalation bugs in sound drivers.

# Disables the core audio subsystem. Drops legacy sound management layers.
blacklist soundcore
install soundcore /bin/true

# Disables Advanced Linux Sound Architecture (ALSA). Completely shuts down
# the modern audio driver framework.
blacklist snd
install snd /bin/true

# Disables Video4Linux loopback device. Used for creating virtual webcams,
# which is entirely unnecessary on headless infrastructure.
blacklist v4l2_loopback
install v4l2_loopback /bin/true
