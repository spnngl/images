# Packet filtering is nftables only (Cilium, and nft if a node needs a rule):
# the legacy x_tables tables can't load, so no tool can add iptables-legacy
# rules that nft doesn't show. `install … /bin/false`, not `blacklist`, which
# only stops loading by alias. iptables stays installed for kubelet (an RPM
# dependency) and Cilium: it is iptables-nft, which uses nf_tables.
install ip_tables /bin/false
install ip6_tables /bin/false
install arp_tables /bin/false
install ebtables /bin/false
