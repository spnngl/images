# journald's settings on FCOS, stated for CIS (OpenSCAP): its ForwardToSyslog
# check reads this file only, not the drop-ins. It replaces
# /usr/lib/systemd/journald.conf, which sets nothing.
# Storage: also /usr/lib/systemd/journald.conf.d/10-coreos-persistent.conf's.
# No syslog daemon to forward to.
[Journal]
Storage=persistent
Compress=yes
ForwardToSyslog=no
