# The platform team's account, key-only (etc/ssh/sshd_config.d/00-hardening.conf)
# with passwordless sudo (etc/sudoers.d/99-rootless). No password: sysusers
# locks it. Fixed UID and GID: Ignition may create users in the initrd, and
# an automatic 1000 would collide with the first of them.
# A numeric GID needs its group declared: `u` alone fails with "please create GID 1500".
g rootless 1500
u rootless 1500:1500 "rootless" /var/home/rootless /bin/bash
m rootless wheel
