# Replaces the tlog package's file of the same name, which has `u tlog -`: a
# dynamic ID, while /usr/bin/tlog-rec-session is setuid to the ID the image
# build gave (Containerfile: 1501). A node's /etc/passwd is its own (rootless
# is added at boot), so sysusers makes tlog there from this file, and the IDs
# must agree. `rpm -V tlog` reports this file as changed, by design.
# A numeric GID needs its group declared: `u` alone fails with "please create GID 1501".
g tlog 1501
u tlog 1501:1501 "Tlog terminal I/O logger" /run/tlog /sbin/nologin
