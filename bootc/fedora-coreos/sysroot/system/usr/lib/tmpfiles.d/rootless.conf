# /home is /var/home on this system; sysusers doesn't create the directory.
# By number: in the initrd, ostree populates /var before sysusers runs, and a
# name fails there ("Failed to resolve user": the VM boots to emergency mode).
# The IDs are those of usr/lib/sysusers.d/rootless.conf.
d /var/home/rootless 0700 1500 1500 -
# containerd's CNI binary directory, /opt is /var/opt.
d /var/opt/cni/bin 0755 root root -
