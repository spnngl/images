# Swap on zram, compressed RAM. Without swap, the kernel can only reclaim
# file pages: under memory pressure it drops programs' code and reads it
# back from disk at the next fault. With zram, cold anonymous memory is
# compressed instead. The kubelet allows it (runtime layer,
# usr/lib/kubelet/conf.d/50-swap.conf).
# A drop-in: zram-generator.conf is the package's, and this applies over
# it key by key (zram-generator.conf(5)).
[zram0]
# A share of RAM, as node sizes differ: ram is MemTotal in MiB. Within
# zram-generator's advised 0.1 to 0.5 (zram-generator.conf.example). Full,
# at zstd's usual 3 to 4 times, it holds 5 to 7% of RAM, charged to no
# cgroup.
zram-size = ram * 0.2
# zstd over the kernel's default, lzo-rle: less RAM for the same swapped
# pages, for more CPU. Level 5 over zstd's default 3: a better ratio for
# slower compression, while decompression, which a swap-in waits for,
# stays as fast. https://docs.kernel.org/admin-guide/blockdev/zram.html
compression-algorithm = zstd(level=5)
