# grype's ignore rules for the image (build) and the nodes (grype.timer), read
# by usr/libexec/grype-scan: the fixable Critical vulnerabilities this image
# can't fix itself, which would otherwise fail build.sh.
#
# Each rule names the package's exact version: an update of the package ends
# the rule, and the vulnerability comes back if the update doesn't fix it.
# Delete a rule once grype.json lists it under `ignoredMatches` no more.
# Ignored matches stay in grype.json; grype.prom only counts them
# (grype_ignored_matches).
ignore:
  # Kubernetes' rpms (pkgs.k8s.io): fixed by a Kubernetes or cri-tools
  # release, through KUBERNETES_VERSION.
  - vulnerability: CVE-2026-78663
    reason: x/net of crictl; next cri-tools release
    package: {name: golang.org/x/net, version: v0.58.0}
  - vulnerability: CVE-2026-78663
    reason: Go 1.26.6 of crictl; next cri-tools release
    package: {name: stdlib, version: go1.26.6}
  # kubelet, kubeadm and kubectl's x/net is podman's version: its rule is
  # below.

  # Fedora's packages: fixed by a FCOS release, through BASE_VERSION, or a
  # Fedora update.
  - vulnerability: CVE-2026-78663
    reason: x/net of skopeo; next FCOS release
    package: {name: golang.org/x/net, version: v0.48.0}
  - vulnerability: CVE-2026-78663
    reason: x/net of containerd; next FCOS release
    package: {name: golang.org/x/net, version: v0.55.0}
  - vulnerability: CVE-2026-78663
    reason: >-
      x/net of podman, ignition and grype, and of kubelet, kubeadm and kubectl; next FCOS release,
      Fedora update or Kubernetes release
    package: {name: golang.org/x/net, version: v0.57.0}
  - vulnerability: CVE-2026-33186
    reason: grpc of podman; next FCOS release
    package: {name: google.golang.org/grpc, version: v1.72.2}
  - vulnerability: CVE-2026-111497
    reason: >-
      brotli of grype (0.117.0-2.fc44, Fedora's latest): a crafted stream exhausts the scanner's
      memory; next Fedora update
    package: {name: github.com/andybalholm/brotli, version: v1.2.0}
  - vulnerability: FEDORA-2026-0609e13c0d
    reason: fixed in ca-certificates 2026.2.92_v9.0.319-2.fc44; next FCOS release
    package: {name: ca-certificates, version: 2026.2.92_v9.0.319-1.fc44}

  # False positives.
  - vulnerability: CVE-2026-94603
    reason: >-
      podman 5.8.9 (rpm), fixed in 5.8.8; grype reads the module's pseudo-version, not the release
    package:
      name: github.com/containers/podman/v5
      version: v5.0.0-20261012000000-9c608fd3e228+dirty
