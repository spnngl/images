// tlog-rec-session.conf(5), replacing the package's file: only what differs
// from tlog's defaults is set (journal writer, 10 s latency, no rate limit,
// `shell` /bin/bash, the banner on stderr).
// Read by usr/libexec/tlog-login; REFERENCES.md, "tlog", gives the reasons.
{
    // Keystrokes too: the output alone doesn't show a password typed into a
    // prompt that doesn't echo, nor what an editor was told. That puts
    // secrets typed at such a prompt in the journal, and in the collector:
    // the journal and the collector are as protected as the node's root.
    "log": {
        "input": true
    }
}
