# rootless can use the node as an SSH jump host (ssh -J), which needs local
# forwarding only: `local` keeps remote forwarding (listeners on the node)
# off, so PermitListen doesn't matter. Check with
# `sshd -T -C user=rootless,host=x,addr=192.0.2.1`: Match blocks don't show in
# a plain `sshd -T`.
Match User rootless
ForceCommand none
DisableForwarding no
AllowTcpForwarding local
PermitOpen any
X11Forwarding no
AllowAgentForwarding no
GatewayPorts no
