# 00-, not 90-: sshd keeps the FIRST value it reads for a keyword, and the
# base's drop-ins (40-disable-passwords, 50-redhat,
# 90-afterburn-authorized-keys-file, 91-ignition-authorized-keys-file) are
# read in lexical order. Whatever must be authoritative sorts before them.
# Check the effective value with `sshd -T`, not the file.
Port 22
AddressFamily inet
AllowUsers rootless
UseDNS no
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
MaxAuthTries 3
# PAM can serve a password prompt over keyboard-interactive: this closes
# that path.
KbdInteractiveAuthentication no
# MUST STAY `yes`. The rootless password is locked (usr/lib/sysusers.d/rootless.conf
# writes `!*` to /etc/shadow). With `UsePAM no`, sshd runs its own
# locked-account check, treats that as a locked account and refuses the user
# before any key is offered: `Permission denied (publickey)`, which looks like
# a missing key. PAM doesn't equate a locked password with a locked account.
# Password login stays impossible through AuthenticationMethods and
# PasswordAuthentication, never through UsePAM.
UsePAM yes
AllowAgentForwarding no
X11Forwarding no
IgnoreRhosts yes
AuthenticationMethods publickey
# Only the keys that ship in the image (/usr, read-only): a key comes with an
# image update and is removed the same way. Nothing writable: not /etc, not
# ~/.ssh, so keys that Ignition, Afterburn or whatever write to
# ~/.ssh/authorized_keys.d are ignored (the console still lists them).
AuthorizedKeysFile /usr/lib/ssh/authorized_keys/%u
AllowTcpForwarding no
HostbasedAuthentication no
# No Kerberos. The Containerfile deletes 50-redhat.conf's `yes`, which OpenSCAP
# reports even though this file's comes first.
GSSAPIAuthentication no
PermitUserEnvironment no
# CIS's values (OpenSCAP, usr/share/xml/scap/fedora-coreos/tailoring.xml).
# A client that stops answering is dropped within 600 s; an idle one that
# answers stays.
ClientAliveInterval 300
ClientAliveCountMax 1
LoginGraceTime 60
MaxSessions 10
MaxStartups 10:30:60
# Logs each key's fingerprint at login.
LogLevel VERBOSE
Banner /etc/issue.net
