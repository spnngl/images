# Kubernetes' repository, bind-mounted into /etc/yum.repos.d by the
# Containerfile's kube stage, never in an image. One per minor release:
# ${minor} is a dnf variable, the stage sets it (DNF_VAR_minor) from
# KUBERNETES_VERSION.

[kubernetes]
name=Kubernetes v${minor}
baseurl=https://pkgs.k8s.io/core:/stable:/v${minor}/rpm/
enabled=1
gpgcheck=1
gpgkey=https://pkgs.k8s.io/core:/stable:/v${minor}/rpm/repodata/repomd.xml.key
