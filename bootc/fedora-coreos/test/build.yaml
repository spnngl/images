# Checks of the image's files, run at build time by the Containerfile's
# `goss` stage: what holds without booting. test.sh checks the booted node.
# Patterns: a plain string is a substring of a line, /.../ a regular
# expression, a leading ! negates.

package:
  # What the Containerfile installs, and what the base ships that the node
  # needs.
  kubelet: {installed: true}
  kubeadm: {installed: true}
  kubectl: {installed: true}
  cri-tools: {installed: true}
  containerd: {installed: true}
  runc: {installed: true}
  conntrack-tools: {installed: true}
  socat: {installed: true}
  sysstat: {installed: true}
  iproute-tc: {installed: true}
  rootlesskit: {installed: true}
  net-tools: {installed: true}
  qemu-guest-agent: {installed: true}
  systemd-udev: {installed: true}
  systemd-networkd: {installed: true}
  openssh-clients: {installed: true}
  grype: {installed: true}
  nushell: {installed: true}
  bootc: {installed: true}
  rpm-ostree: {installed: true}
  podman: {installed: true}
  # What it removes, and what must never come in.
  zincati: {installed: false}
  moby-engine: {installed: false}
  docker-cli: {installed: false}
  toolbox: {installed: false}
  firewalld: {installed: false}
  ufw: {installed: false}
  iptables-legacy: {installed: false}
  iptables-services: {installed: false}
  nmstate: {installed: false}
  NetworkManager-team: {installed: false}
  NetworkManager-tui: {installed: false}
  NetworkManager-cloud-setup: {installed: false}
  ModemManager: {installed: false}
  etcd: {installed: false}
  dnsmasq: {installed: false}
  rsync: {installed: false}
  rpcbind: {installed: false}
  nfsv3-client-utils: {installed: false}

file:
  # The base's /opt is the symlink to /var/opt: /var ships empty.
  /opt: {exists: true, filetype: symlink, linked-to: /var/opt}
  /usr/share/scap-security-guide: {exists: false}
  /etc/containers/registries.d/spnngl-images.yaml:
    exists: true
    contents: ["/^ *use-sigstore-attachments: true$/"]
  /etc/sudoers.d/99-rootless: {exists: true, filetype: file, mode: "0440"}
  # The image's value; vm.sh adds the test key's folder before it, through
  # Ignition.
  /etc/ssh/sshd_config.d/00-hardening.conf:
    exists: true
    contents: ["/^AuthorizedKeysFile /usr/lib/ssh/authorized_keys/%u$/"]
  # The RPMs ship no bash completion; etc/profile.d/kubernetes.sh loads it.
  /usr/share/bash-completion/completions/kubectl: {exists: true, filetype: file, size: {gt: 0}}
  /usr/share/bash-completion/completions/kubeadm: {exists: true, filetype: file, size: {gt: 0}}
  /usr/share/bash-completion/completions/crictl: {exists: true, filetype: file, size: {gt: 0}}
  # kubelet tries to create it, and /usr is read-only at runtime.
  /usr/libexec/kubernetes/kubelet-plugins/volume/exec: {exists: true, filetype: directory}

  # Units are enabled by links in /usr/lib (Containerfile): `systemctl
  # is-enabled` would call them disabled.
  /usr/lib/systemd/system/multi-user.target.wants/containerd.service: {exists: true, filetype: symlink, linked-to: ../containerd.service}
  /usr/lib/systemd/system/multi-user.target.wants/kubelet.service: {exists: true, filetype: symlink, linked-to: ../kubelet.service}
  /usr/lib/systemd/system/multi-user.target.wants/amd-hsmp.service: {exists: true, filetype: symlink, linked-to: ../amd-hsmp.service}
  /usr/lib/systemd/system/multi-user.target.wants/openstack-hostname.service: {exists: true, filetype: symlink, linked-to: ../openstack-hostname.service}
  /usr/lib/systemd/system/multi-user.target.wants/openstack-disk-tags.service: {exists: true, filetype: symlink, linked-to: ../openstack-disk-tags.service}
  /usr/lib/systemd/system/multi-user.target.wants/greenboot-healthcheck.service: {exists: true, filetype: symlink, linked-to: ../greenboot-healthcheck.service}
  /usr/lib/systemd/system/multi-user.target.wants/systemd-networkd.service: {exists: true, filetype: symlink, linked-to: ../systemd-networkd.service}
  # The softnet budget is for large machines with a Mellanox NIC, the metal
  # sysctls for dedicated servers: each unit's condition picks the node.
  /usr/lib/systemd/system/multi-user.target.wants/sysctl-mlx5-large.service: {exists: true, filetype: symlink, linked-to: ../sysctl-mlx5-large.service}
  /usr/lib/systemd/system/multi-user.target.wants/sysctl-metal.service: {exists: true, filetype: symlink, linked-to: ../sysctl-metal.service}
  /usr/lib/systemd/system/paths.target.wants/etcd-network-tuning.path: {exists: true, filetype: symlink, linked-to: ../etcd-network-tuning.path}
  /usr/lib/systemd/system/timers.target.wants/etcd-defrag.timer: {exists: true, filetype: symlink, linked-to: ../etcd-defrag.timer}
  /usr/lib/systemd/system/timers.target.wants/openscap.timer: {exists: true, filetype: symlink, linked-to: ../openscap.timer}
  /usr/lib/systemd/system/timers.target.wants/etc-diff.timer: {exists: true, filetype: symlink, linked-to: ../etc-diff.timer}
  /usr/lib/systemd/system/timers.target.wants/grype.timer: {exists: true, filetype: symlink, linked-to: ../grype.timer}
  /usr/lib/systemd/system/sysinit.target.wants/wx-remount.service: {exists: true, filetype: symlink, linked-to: ../wx-remount.service}
  /usr/lib/systemd/system/local-fs.target.wants/var-lib-kubelet.mount: {exists: true, filetype: symlink, linked-to: ../var-lib-kubelet.mount}
  /usr/lib/systemd/system/local-fs.target.wants/var-opt-cni-bin.mount: {exists: true, filetype: symlink, linked-to: ../var-opt-cni-bin.mount}
  /usr/lib/systemd/system/network-online.target.wants/systemd-networkd-wait-online.service: {exists: true, filetype: symlink, linked-to: ../systemd-networkd-wait-online.service}
  /usr/lib/systemd/system/ostree-finalize-staged.service.requires/greenboot-set-rollback-trigger.service: {exists: true, filetype: symlink, linked-to: ../greenboot-set-rollback-trigger.service}
  # Masked: FCOS's `systemctl preset-all` at first boot would enable them
  # again if they were only disabled.
  /etc/systemd/system/rpm-ostree-countme.timer: {exists: true, filetype: symlink, linked-to: /dev/null}
  /etc/systemd/system/systemd-homed.service: {exists: true, filetype: symlink, linked-to: /dev/null}
  /etc/systemd/system/systemd-homed-activate.service: {exists: true, filetype: symlink, linked-to: /dev/null}
  /usr/lib/systemd/system/zincati.service: {exists: false}
  /usr/lib/systemd/system/docker.socket: {exists: false}
  # VM-only units, bare-metal-only ones: what systemd-detect-virt says.
  /usr/lib/systemd/system/openstack-hostname.service:
    exists: true
    contents: ["/^ConditionVirtualization=vm$/"]
  /usr/lib/systemd/system/openstack-disk-tags.service:
    exists: true
    contents: ["/^ConditionVirtualization=vm$/"]
  /usr/lib/systemd/system/qemu-guest-agent.service.d/20-vm.conf:
    exists: true
    contents: ["/^ConditionVirtualization=vm$/"]
  /usr/lib/systemd/system/amd-hsmp.service:
    exists: true
    contents: ["/^ConditionVirtualization=false$/"]
  /usr/lib/systemd/system/etcd-defrag.service:
    exists: true
    contents: ["/^ConditionPathExists=/etc/kubernetes/manifests/etcd.yaml$/"]
  /usr/lib/systemd/system/containerd.service.d/10-slice.conf:
    exists: true
    contents: ["/^Slice=kube.slice$/"]
  /usr/lib/systemd/system/kubelet.service.d/00-slice.conf:
    exists: true
    contents: ["/^Slice=kube.slice$/"]
  /usr/lib/systemd/system/containerd.service.d/20-config.conf:
    exists: true
    contents: ["/^ExecStart=/usr/bin/containerd --config /usr/lib/containerd/config.toml$/"]
  # network-online waits for one routable link, not for all of them.
  /usr/lib/systemd/system/systemd-networkd-wait-online.service.d/10-any.conf:
    exists: true
    contents: ["--any --operational-state=routable"]

command:
  # The scans read Fedora's data stream alone (Containerfile, macros.ssg).
  scap-security-guide, Fedora's data stream alone:
    exec: test "$(ls /usr/share/xml/scap/ssg/content)" = ssg-fedora-ds.xml
    exit-status: 0
  # Each node makes its own identity at first boot.
  ssh host keys:
    exec: test -z "$(find /etc/ssh -name 'ssh_host_*')"
    exit-status: 0
  machine-id is empty:
    exec: test ! -s /etc/machine-id
    exit-status: 0
  signatures, the key policy.json names:
    exec: test -s "$(jq -r '.transports.docker["ghcr.io/spnngl/images"][0].keyPath' /etc/containers/policy.json)"
    exit-status: 0
  # iptables commands use nf_tables; the legacy x_tables tables can't load.
  iptables is iptables-nft:
    exec: iptables --version
    exit-status: 0
    stdout: [nf_tables]
  rootless sudoers parse:
    exec: visudo -cf /etc/sudoers.d/99-rootless
    exit-status: 0
  rootless keys:
    exec: grep -c ^ssh-ed25519 /usr/lib/ssh/authorized_keys/rootless
    exit-status: 0
    stdout: ["/^2$/"]

  # sshd: the first value wins, so check what it resolves to. UsePAM must
  # stay yes (etc/ssh/sshd_config.d/00-hardening.conf). `sshd -T` needs a
  # host key: a throwaway one.
  sshd, resolved:
    exec: ssh-keygen -q -t ed25519 -N '' -f /tmp/sshd-all && sshd -T -h /tmp/sshd-all
    exit-status: 0
    stdout:
      - /^passwordauthentication no$/
      - /^permitrootlogin no$/
      - /^usepam yes$/
      - /^kbdinteractiveauthentication no$/
      - /^authorizedkeysfile /usr/lib/ssh/authorized_keys/%u$/
      - /^gssapiauthentication no$/
  # What applies to rootless, Match blocks included (90-allow-proxyjump.conf).
  sshd, resolved for rootless:
    exec: ssh-keygen -q -t ed25519 -N '' -f /tmp/sshd-rootless && sshd -T -h /tmp/sshd-rootless -C user=rootless,host=x,addr=192.0.2.1
    exit-status: 0
    stdout:
      - /^passwordauthentication no$/
      - /^permitrootlogin no$/
      - /^usepam yes$/
      - /^kbdinteractiveauthentication no$/
      - /^authenticationmethods publickey$/
      - /^allowusers rootless$/
      - /^maxauthtries 3$/
      - /^allowagentforwarding no$/
      - /^allowtcpforwarding local$/
      - /^gatewayports no$/
      - /^gssapiauthentication no$/

  # containerd ignores a mistyped plugin key: check the merged config.
  containerd, merged config:
    exec: containerd --config /usr/lib/containerd/config.toml config dump
    exit-status: 0
    timeout: 60000
    stdout:
      - SystemdCgroup = true
      - base_runtime_spec = '/usr/lib/containerd/cri-base.json'
      - use_internal_loopback = true
      - /opt/cni/bin
      - max_container_log_line_size = 16384
      - enable_selinux = false
  # The sandbox image kubeadm of this release expects, so that kubelet and
  # containerd agree on it.
  containerd, pause image is kubeadm's:
    exec: |
      want=$(kubeadm config images list --kubernetes-version "v$(rpm -q --qf '%{VERSION}' kubeadm)" | grep /pause:) &&
        containerd --config /usr/lib/containerd/config.toml config dump | grep -qF "sandbox = '${want}'"
    exit-status: 0
    timeout: 60000
  # `ctr oci spec` with a higher open-files limit.
  containerd, cri-base.json:
    exec: |
      ctr oci spec | jq -S 'del(.ociVersion, .process.rlimits)' > /tmp/cri-default.json &&
        jq -S 'del(.ociVersion, .process.rlimits)' /usr/lib/containerd/cri-base.json | diff /tmp/cri-default.json - &&
        jq -e '.process.rlimits == [{type: "RLIMIT_NOFILE", hard: 65535, soft: 65535}]' /usr/lib/containerd/cri-base.json
    exit-status: 0
    timeout: 60000

  coredump storage:
    exec: systemd-analyze cat-config systemd/coredump.conf
    exit-status: 0
    stdout: [/^Storage=external$/]
  systemd-coredump.socket is not masked:
    exec: systemctl is-enabled systemd-coredump.socket || true
    exit-status: 0
    stdout: ["/^[a-z-]+$/", "!masked"]
  resolved settings:
    exec: systemd-analyze cat-config systemd/resolved.conf
    exit-status: 0
    stdout: [/^Domains=~.$/, /^FallbackDNS=1.1.1.1#cloudflare-dns.com/]
  # Cilium's routes, rules and nexthops (capi-image-builder's goss).
  networkd leaves foreign routes, rules and nexthops:
    exec: systemd-analyze cat-config systemd/networkd.conf
    exit-status: 0
    stdout: [/^ManageForeignRoutes=no$/, /^ManageForeignRoutingPolicyRules=no$/, /^ManageForeignNextHops=no$/]
  usb-storage is blacklisted:
    exec: modprobe -c
    exit-status: 0
    stdout: [/^blacklist usb_storage$/]

  # udev (the etcd and OpenStack rules), and the scripts they call.
  udev rule 60-qemu-disk-readahead is valid:
    exec: udevadm verify /usr/lib/udev/rules.d/60-qemu-disk-readahead.rules
    exit-status: 0
  udev rule 99-openstack-by-tag is valid:
    exec: udevadm verify /usr/lib/udev/rules.d/99-openstack-by-tag.rules
    exit-status: 0
  disk-by-tag helper prints nothing without OpenStack metadata:
    exec: test -z "$(ID_SERIAL_SHORT=x /usr/libexec/openstack-disk-by-tag)"
    exit-status: 0
  scripts parse:
    exec: |
      for s in /usr/libexec/openstack-fetch-metadata /usr/libexec/openstack-disk-by-tag /usr/libexec/etcd-network-tuning.sh; do
        bash -n "${s}" || exit 1
      done
    exit-status: 0
  RAID and LUKS tools:
    exec: |
      for c in mdadm cryptsetup systemd-cryptenroll pvcreate vgcreate networkctl tc; do
        command -v "${c}" >/dev/null || { echo "missing: ${c}"; exit 1; }
      done
    exit-status: 0
  # The TPM2 libraries systemd-cryptenroll loads. `has-tpm2` fails without
  # a TPM, and still lists them.
  TPM2 libraries for systemd-cryptenroll:
    exec: systemd-analyze has-tpm2 || true
    exit-status: 0
    stdout: [+libtss2-esys.so, +libtss2-rc.so, +libtss2-mu.so]
